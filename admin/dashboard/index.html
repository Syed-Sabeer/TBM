<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin, B = TBMBags;
  var me = U.admin();

  var mount = U.renderShell('dashboard', 'Dashboard',
    new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'}));

  var months = A.byMonth(null, 12);
  var prev = A.byMonth(null, 24).slice(0,12);
  var rev12 = months.reduce(function(s,m){ return s+m.spend; },0);
  var revPrev = prev.reduce(function(s,m){ return s+m.spend; },0);
  var delta = revPrev ? (rev12-revPrev)/revPrev*100 : 0;
  var pieces12 = months.reduce(function(s,m){ return s+m.pieces; },0);
  var orders12 = months.reduce(function(s,m){ return s+m.orders; },0);
  var usd0 = function(n){ return '$' + Math.round(n).toLocaleString('en-US'); };

  var pending = A.ORDERS.filter(function(o){ return o.status==='Pending confirmation'; });
  var production = A.ORDERS.filter(function(o){ return o.status==='In production'; });
  var activeAccts = A.COMPANIES.filter(function(c){ return c.status==='Active'; }).length;
  var pendingAccts = A.COMPANIES.filter(function(c){ return c.status==='Pending approval'; });
  var todayImport = A.IMPORTS[0];

  /* low stock: under 10 weeks of cover at the last 12 months' run rate */
  var lowStock = D.PRODUCTS.map(function(p){
    return { p:p, onHand:D.totalStock(p), monthly:A.monthlyUse(p.sku), weeks:A.weeksCover(p) };
  }).filter(function(x){ return x.weeks < 10; }).sort(function(a,b){ return a.weeks-b.weeks; });

  mount.innerHTML =
    '<div class="adm-head">'+
      '<div><h2>Good ' + (new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening') + ', ' + me.name.split(' ')[0] + '.</h2>'+
      '<p>' + pending.length + ' orders are waiting on you, ' + pendingAccts.length + ' accounts need approving, and this morning’s stock import ' +
      (todayImport.warnings ? 'applied with ' + todayImport.warnings + ' warnings.' : 'applied cleanly.') + '</p></div>'+
      '<div class="row" style="gap:10px">'+
        '<a class="btn btn-outline" href="../import/">Review import</a>'+
        '<a class="btn btn-primary" href="../orders/?status=Pending%20confirmation">Confirm orders</a>'+
      '</div>'+
    '</div>'+

    /* KPIs */
    '<div class="stat-grid" style="grid-template-columns:1.25fr 1fr 1fr 1fr">'+
      '<div class="hero-fig">'+
        '<div class="lab">Revenue, last 12 months</div>'+
        '<div class="val">'+usd0(rev12)+'</div>'+
        '<div class="sub">'+(delta>=0
          ? '<span class="up">&#9650; '+delta.toFixed(0)+'%</span> vs the 12 months before'
          : '<span>&#9660; '+Math.abs(delta).toFixed(0)+'%</span> vs the 12 months before')+'</div>'+
      '</div>'+
      '<div class="stat"><div class="lab">Orders</div><div class="val">'+orders12+'</div>'+
        '<div class="sub">'+TBM.num(pieces12)+' pieces shipped</div>'+
        '<div class="spark">'+U.sparkline(months.map(function(m){return m.orders;}))+'</div></div>'+
      '<div class="stat"><div class="lab">Needs action</div><div class="val">'+(pending.length+pendingAccts.length)+'</div>'+
        '<div class="sub">'+pending.length+' orders · '+pendingAccts.length+' accounts</div>'+
        '<div style="margin-top:12px"><a class="btn btn-outline btn-sm btn-block" href="../orders/?status=Pending%20confirmation">Open the queue</a></div></div>'+
      '<div class="stat"><div class="lab">Accounts</div><div class="val">'+activeAccts+'</div>'+
        '<div class="sub">'+A.COMPANIES.filter(function(c){return c.status==='On hold';}).length+' on hold · '+pendingAccts.length+' pending</div>'+
        '<div class="spark">'+U.sparkline(months.map(function(m,i){ return 6 + i*0.4 + (i%3); }))+'</div></div>'+
    '</div>'+

    /* Revenue chart */
    '<div class="chart-card" style="margin-top:20px">'+
      '<div class="panel-head">'+
        '<div><h3>Revenue by month</h3><div class="small muted" style="margin-top:3px">All accounts, cancelled orders excluded. Priced at each account’s own rate card.</div></div>'+
        '<div class="seg" id="metricSeg">'+
          '<button class="is-active" data-m="spend">Revenue</button>'+
          '<button data-m="pieces">Pieces</button>'+
          '<button data-m="orders">Orders</button>'+
        '</div>'+
      '</div>'+
      '<div class="chart-body"><div id="revChart" style="min-height:230px"></div></div>'+
    '</div>'+

    /* Queue + activity */
    '<div class="adm-split" style="margin-top:20px">'+
      '<div style="display:grid;gap:20px">'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>Awaiting confirmation</h3>'+
            '<a class="link-arrow" href="../orders/?status=Pending%20confirmation">All '+pending.length+' <span>'+I.arrow+'</span></a></div>'+
          '<div class="table-wrap"><table class="table adm-table" id="queueTable"></table></div>'+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>Below 10 weeks of cover</h3>'+
            '<a class="link-arrow" href="../inventory/?view=low">Stock <span>'+I.arrow+'</span></a></div>'+
          '<div class="table-wrap"><table class="table adm-table" id="lowTable"></table></div>'+
        '</div>'+
      '</div>'+
      '<div style="display:grid;gap:18px">'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>This morning’s import</h3>'+
            '<span class="badge '+(todayImport.warnings?'badge-warn':'badge-ok')+'">'+
              (todayImport.warnings ? todayImport.warnings+' unmatched' : 'Applied cleanly')+'</span></div>'+
          '<div class="panel-body">'+
            '<div class="summary-row" style="padding:5px 0"><span class="muted">File</span><span class="v mono" style="font-size:.75rem">'+todayImport.file+'</span></div>'+
            '<div class="summary-row" style="padding:5px 0"><span class="muted">Rows read</span><span class="v">'+todayImport.rows+'</span></div>'+
            '<div class="summary-row" style="padding:5px 0"><span class="muted">Stock updated</span><span class="v">'+todayImport.updated+'</span></div>'+
            '<div class="summary-row" style="padding:5px 0"><span class="muted">Unmatched</span><span class="v '+(todayImport.warnings?'':'muted')+'">'+todayImport.warnings+'</span></div>'+
            '<div class="summary-row" style="padding:5px 0"><span class="muted">Ran</span><span class="v">'+todayImport.by+'</span></div>'+
            '<a class="btn btn-primary btn-sm btn-block" style="margin-top:14px" href="../import/">Review unmatched rows</a>'+
          '</div>'+
        '</div>'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>Activity</h3><span class="small muted">Today</span></div>'+
          '<div class="panel-body" style="display:grid;gap:14px" id="feed"></div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    /* Top customers + items */
    '<div class="grid g-2" style="margin-top:20px;align-items:start">'+
      '<div class="panel">'+
        '<div class="panel-head"><h3>Top accounts, 12 months</h3><a class="link-arrow" href="../customers/">All <span>'+I.arrow+'</span></a></div>'+
        '<div class="panel-body" id="topCo"></div>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-head"><h3>Top items, 12 months</h3><a class="link-arrow" href="../reports/">Reports <span>'+I.arrow+'</span></a></div>'+
        '<div class="panel-body" id="topItems"></div>'+
      '</div>'+
    '</div>';

  /* Chart */
  var metric='spend';
  function paintChart(){
    U.columnChart(document.getElementById('revChart'), months.map(function(m){
      return { label:m.label, full:m.full, value:m[metric],
        tip: TBM.usd(m.spend)+'<br><span class="k">'+TBM.num(m.pieces)+' pcs · '+m.orders+' orders</span>' };
    }), { prefix: metric==='spend'?'$':'', alt:'Revenue by month' });
  }
  document.getElementById('metricSeg').addEventListener('click', function(e){
    var b=e.target.closest('button[data-m]'); if(!b) return;
    metric=b.dataset.m;
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('is-active',x===b); });
    paintChart();
  });
  paintChart();

  /* Queue */
  document.getElementById('queueTable').innerHTML =
    '<thead><tr><th>Order</th><th>Account</th><th>Placed</th><th class="num">Pieces</th><th class="num">Value</th><th></th></tr></thead><tbody>'+
    pending.slice(0,8).map(function(o){
      return '<tr><td class="nw"><a class="lk mono" href="../order/?id='+o.id+'">'+o.id+'</a>'+
        '<div class="small muted">'+o.po+'</div></td>'+
        '<td class="nw"><a class="lk" href="../customer/?id='+o.companyId+'">'+o.company+'</a>'+
        '<div class="small muted">'+o.user+'</div></td>'+
        '<td class="nw">'+U.fmtShort(o.date)+'</td>'+
        '<td class="num">'+TBM.num(A.orderPieces(o))+'</td>'+
        '<td class="num"><b>'+TBM.usd(A.orderTotal(o))+'</b></td>'+
        '<td class="num"><a class="btn btn-primary btn-sm" href="../order/?id='+o.id+'">Review</a></td></tr>';
    }).join('')+'</tbody>';

  /* Feed */
  document.getElementById('feed').innerHTML = A.ACTIVITY.slice(0,6).map(function(a){
    return '<div style="display:flex;gap:11px;align-items:flex-start">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--kraft);flex:none;margin-top:6px"></span>'+
      '<span style="min-width:0"><b style="font-size:.8125rem;display:block">'+a[0]+'</b>'+
      '<span class="small muted" style="display:block;line-height:1.45">'+a[1]+'</span>'+
      '<span class="small" style="color:var(--muted-2)">'+a[3]+' · '+a[2]+'</span></span></div>';
  }).join('');

  /* Low stock */
  document.getElementById('lowTable').innerHTML =
    '<thead><tr><th>Item</th><th>Description</th><th class="num">On hand</th><th>Cover</th><th class="num">Next intake</th><th></th></tr></thead><tbody>'+
    (lowStock.length ? lowStock : D.PRODUCTS.map(function(p){
      return { p:p, onHand:D.totalStock(p), monthly:A.monthlyUse(p.sku), weeks:A.weeksCover(p) };
    }).sort(function(a,b){ return a.weeks-b.weeks; })).slice(0,7).map(function(x,i){
      var weeks = x.weeks;
      return '<tr><td class="nw"><a class="lk mono" href="../product/?sku='+x.p.sku+'">'+x.p.sku+'</a>'+
        '<div class="sku-parent">'+x.p.parentSku+'</div></td>'+
        '<td>'+x.p.name+'</td>'+
        '<td class="num"><b>'+TBM.num(x.onHand)+'</b></td>'+
        '<td class="nw"><span class="badge '+(weeks<5?'badge-bad':weeks<10?'badge-warn':'badge-ok')+'">'+weeks.toFixed(1)+' weeks</span></td>'+
        '<td class="num muted nw">'+TBM.num(2000+((i*1700)%9000))+' in '+(6+i*3)+'d</td>'+
        '<td class="num"><a class="btn btn-outline btn-sm" href="../inventory/?sku='+x.p.sku+'">Adjust</a></td></tr>';
    }).join('')+'</tbody>';

  /* Top lists */
  document.getElementById('topCo').innerHTML = U.barList(A.byCompany().slice(0,7).map(function(c){
    return { label:c.label, value:c.spend, display:TBM.usd(c.spend), sub:c.orderCount+' orders · '+TBM.num(c.pieces)+' pcs' };
  }));
  document.getElementById('topItems').innerHTML = U.barList(A.byItem().slice(0,7).map(function(x){
    return { label:x.label, mono:x.key, value:x.pieces, display:TBM.num(x.pieces)+' pcs', sub:TBM.usd(x.spend) };
  }));
})();
</script>
</body>
</html>
