<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Imports — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin, B = TBMBags;

  var mount = U.renderShell('import', 'Imports', 'Stock and pricing from the supplier sheet');

  /* ---------- State ---------- */
  var step = 1;
  var kind = 'stock';
  var fileName = '';
  var rows = [];
  var mapping = {};        /* source column -> target field */
  var applied = null;

  var FIELDS = [
    ['parentSku', 'Parent SKU (mill reference)'],
    ['desc',      'Description'],
    ['color',     'Colour / shade'],
    ['qty',       'Quantity on hand'],
    ['warehouse', 'Warehouse code'],
    ['ready',     'Next ready date'],
    ['cost',      'FOB cost'],
    ['',          '— ignore this column —']
  ];
  var AUTO = { MILL_REF:'parentSku', DESCRIPTION:'desc', SHADE:'color', LOT_QTY:'qty',
               WH:'warehouse', READY_DATE:'ready', FOB_USD:'cost' };

  var KINDS = [
    ['stock',   'Stock levels',        'The daily sheet from the mill: quantity on hand per parent SKU, colour and warehouse.'],
    ['cost',    'Mill cost / FOB',     'Landed cost per parent SKU. Feeds margin reporting — never shown to customers.'],
    ['ratecard','Customer rate card',  'A negotiated price file loaded against one account, overriding its tier.'],
    ['catalog', 'Product catalog',     'New parent SKUs, descriptions, sizes and colourways.']
  ];

  /* ---------- Row resolution ---------- */
  function resolve(){
    return A.SHEET_ROWS.map(function(r, i){
      var p = r._id ? D.byId(r._id) : null;
      var colorKnown = p && r._color && p.colors.indexOf(r._color) > -1;
      var status = !p ? 'unmatched' : (!r._color ? 'newcolor' : 'ok');
      var oldQ = r._old || 0, newQ = r.LOT_QTY;
      return {
        i:i, raw:r, product:p, status:status,
        sku: p ? p.sku : null,
        parentSku: r.MILL_REF,
        colorKey: r._color, colorLabel: r.SHADE,
        wh: r.WH, old: oldQ, neu: newQ, delta: newQ - oldQ,
        cost: r.FOB_USD, ready: r.READY_DATE
      };
    });
  }

  function counts(){
    var c = { total:rows.length, ok:0, changed:0, unmatched:0, newcolor:0, up:0, down:0 };
    rows.forEach(function(r){
      if (r.status==='unmatched') c.unmatched++;
      else if (r.status==='newcolor') c.newcolor++;
      else c.ok++;
      if (r.status!=='unmatched'){
        if (r.delta>0){ c.up++; c.changed++; }
        else if (r.delta<0){ c.down++; c.changed++; }
      }
    });
    return c;
  }

  /* ---------- Render ---------- */
  function wiz(){
    var labels = ['Source','Map columns','Preview','Apply'];
    return '<div class="wiz">'+ labels.map(function(l,i){
      var n = i+1;
      var cls = n<step ? 'done' : n===step ? 'now' : '';
      return (i? '<span class="bar"></span>':'') +
        '<span class="st '+cls+'"><span class="n">'+(n<step ? I.check : n)+'</span>'+l+'</span>';
    }).join('') + '</div>';
  }

  function render(){
    mount.innerHTML =
      '<div class="adm-head">'+
        '<div><h2>Imports</h2><p>The daily supplier sheet lands here. Quantities go to the storefront; costs and mill references stay in the back office and never reach a customer.</p></div>'+
        '<div class="row" style="gap:10px">'+
          '<button class="btn btn-outline" id="schedBtn">Scheduled imports</button>'+
          (step>1 ? '<button class="btn btn-ghost" id="startOver">Start over</button>' : '')+
        '</div>'+
      '</div>'+
      wiz() +
      '<div id="stepBody"></div>'+
      '<div id="schedPanel" class="hide"></div>'+
      '<div style="margin-top:26px">'+
        '<div class="row-between" style="margin-bottom:14px">'+
          '<h3 class="h3">Import history</h3>'+
          '<button class="link-arrow" id="expHist">Export log</button>'+
        '</div>'+
        '<div class="panel"><div class="table-wrap"><table class="table adm-table" id="histTable"></table></div></div>'+
      '</div>';

    ({1:stepSource, 2:stepMap, 3:stepPreview, 4:stepApply})[step]();
    paintHistory();

    var so = document.getElementById('startOver');
    if (so) so.addEventListener('click', function(){ step=1; rows=[]; fileName=''; applied=null; render(); });
    document.getElementById('schedBtn').addEventListener('click', toggleSched);
    document.getElementById('expHist').addEventListener('click', function(){
      U.download('tbm-import-log.csv', U.csv(
        [['Import','Date','File','Type','Rows','Updated','Added','Warnings','Run by','Status']].concat(
          A.IMPORTS.map(function(x){ return [x.id, U.fmtDate(x.date), x.file, x.kind, x.rows, x.updated, x.added, x.warnings, x.by, x.status]; }))
      ));
      TBM.toast('Import log exported');
    });
  }

  /* ---------- Step 1 ---------- */
  function stepSource(){
    document.getElementById('stepBody').innerHTML =
      '<div class="adm-split">'+
        '<div>'+
          '<div class="panel" style="margin-bottom:18px">'+
            '<div class="panel-head"><h3>What are you importing?</h3></div>'+
            '<div class="panel-body"><div class="radio-stack">'+
              KINDS.map(function(k){
                return '<label class="radio-card"><input type="radio" name="kind" value="'+k[0]+'" '+(kind===k[0]?'checked':'')+'>'+
                  '<span><b>'+k[1]+'</b><span class="small muted" style="display:block">'+k[2]+'</span></span></label>';
              }).join('')+
            '</div></div>'+
          '</div>'+

          '<div class="drop" id="drop">'+
            '<div class="ico">'+I.doc+'</div>'+
            '<h3>Drop the sheet here</h3>'+
            '<p>.xlsx, .xls or .csv, up to 20 MB. The first row is treated as the header. You will map the columns on the next step and nothing is written until you approve the preview.</p>'+
            '<div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">'+
              '<label class="btn btn-primary">Choose a file<input type="file" id="file" accept=".csv,.xlsx,.xls" hidden></label>'+
              '<button class="btn btn-outline" id="useToday">Use today’s mill sheet</button>'+
            '</div>'+
          '</div>'+
        '</div>'+

        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>What this sheet controls</h3></div><div class="panel-body">'+
            '<ul class="check-list">'+
              '<li><span class="tick">'+I.check+'</span><span class="small"><b>Quantity</b> is published to the storefront and to every customer’s item page.</span></li>'+
              '<li><span class="tick">'+I.check+'</span><span class="small"><b>FOB cost</b> is stored for margin reporting only. It is never a customer price.</span></li>'+
              '<li><span class="tick">'+I.check+'</span><span class="small"><b>Parent SKU</b> is matched to the customer item number through the mapping table.</span></li>'+
              '<li><span class="tick">'+I.check+'</span><span class="small">Rows that cannot be matched are held back, never guessed.</span></li>'+
            '</ul>'+
            '<div class="note-box" style="margin-top:16px">'+I.lock+
              '<span>Customer selling prices are <b>not</b> in this file. They come from the rate cards, which this import never touches.</span></div>'+
          '</div></div>'+

          '<div class="panel"><div class="panel-head"><h3>Expected columns</h3></div><div class="panel-body">'+
            A.SHEET_COLUMNS.map(function(c){
              return '<div class="spec-row" style="padding:8px 0"><dt class="mono" style="font-size:.75rem">'+c+'</dt>'+
                '<dd style="font-weight:450;color:var(--muted)">'+(FIELDS.filter(function(f){return f[0]===AUTO[c];})[0]||['','—'])[1]+'</dd></div>';
            }).join('')+
            '<div class="hint" style="margin-top:10px">Column names do not have to match. Anything unrecognised can be mapped by hand on the next step.</div>'+
          '</div></div>'+
        '</div>'+
      '</div>';

    document.querySelectorAll('input[name=kind]').forEach(function(r){
      r.addEventListener('change', function(){ kind = this.value; });
    });

    var drop = document.getElementById('drop');
    ['dragenter','dragover'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('is-over'); });
    });
    ['dragleave','drop'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('is-over'); });
    });
    drop.addEventListener('drop', function(e){
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      loadFile(f ? f.name : 'dropped-sheet.xlsx');
    });
    document.getElementById('file').addEventListener('change', function(e){
      if (e.target.files[0]) loadFile(e.target.files[0].name);
    });
    document.getElementById('useToday').addEventListener('click', function(){
      loadFile(A.IMPORTS[0].file);
    });
  }

  function loadFile(name){
    fileName = name;
    rows = resolve();
    mapping = {};
    A.SHEET_COLUMNS.forEach(function(c){ mapping[c] = AUTO[c] || ''; });
    step = 2;
    render();
    TBM.toast(rows.length + ' rows read from ' + name);
  }

  /* ---------- Step 2 ---------- */
  function stepMap(){
    document.getElementById('stepBody').innerHTML =
      '<div class="adm-split">'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>Map the columns</h3><span class="badge">'+fileName+'</span></div>'+
          '<div class="panel-body">'+
            '<p class="small muted" style="margin-bottom:6px">Detected '+A.SHEET_COLUMNS.length+' columns and '+rows.length+' data rows. We have guessed the mapping from the header names — change anything that looks wrong.</p>'+
            '<div class="maprow" style="border-bottom:1px solid var(--line-2)">'+
              '<span class="label" style="margin:0">Column in your sheet</span><span></span>'+
              '<span class="label" style="margin:0">Maps to</span>'+
              '<span class="label" style="margin:0;text-align:right">Sample</span>'+
            '</div>'+
            A.SHEET_COLUMNS.map(function(c){
              return '<div class="maprow">'+
                '<span class="src" title="'+c+'">'+c+'</span>'+
                '<span class="arr">'+I.arrow+'</span>'+
                '<select class="select" data-col="'+c+'">'+
                  FIELDS.map(function(f){
                    return '<option value="'+f[0]+'" '+(mapping[c]===f[0]?'selected':'')+'>'+f[1]+'</option>';
                  }).join('')+
                '</select>'+
                '<span class="small muted" style="text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
                  String(A.SHEET_ROWS[0][c])+'</span>'+
              '</div>';
            }).join('')+
            '<div class="note-box" style="margin-top:18px">'+I.shield+
              '<span>Save this mapping as a template and the scheduled 06:15 import will apply it automatically every morning without anyone touching it.</span></div>'+
            '<label class="check" style="margin-top:14px"><input type="checkbox" checked><span>Remember this mapping for <b>'+fileName.replace(/[-0-9]+\\.xlsx?$/,'*.xlsx')+'</b></span></label>'+
          '</div>'+
        '</div>'+

        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>First rows, as read</h3></div>'+
            '<div class="table-wrap"><table class="table table-compact adm-table">'+
              '<thead><tr>'+A.SHEET_COLUMNS.slice(0,4).map(function(c){ return '<th>'+c+'</th>'; }).join('')+'</tr></thead><tbody>'+
              A.SHEET_ROWS.slice(0,6).map(function(r){
                return '<tr>'+A.SHEET_COLUMNS.slice(0,4).map(function(c){
                  return '<td class="mono" style="font-size:.6875rem">'+String(r[c])+'</td>';
                }).join('')+'</tr>';
              }).join('')+'</tbody></table></div>'+
          '</div>'+
          '<button class="btn btn-primary btn-lg btn-block" id="toPreview">Preview '+rows.length+' rows</button>'+
          '<div class="adm-note">Nothing is written to stock until you approve the preview.</div>'+
        '</div>'+
      '</div>';

    document.querySelectorAll('[data-col]').forEach(function(sel){
      sel.addEventListener('change', function(){ mapping[this.dataset.col] = this.value; });
    });
    document.getElementById('toPreview').addEventListener('click', function(){
      if (!Object.keys(mapping).some(function(k){ return mapping[k]==='parentSku'; })){
        TBM.toast('Map one column to the parent SKU before continuing.'); return;
      }
      if (!Object.keys(mapping).some(function(k){ return mapping[k]==='qty'; })){
        TBM.toast('Map one column to the quantity before continuing.'); return;
      }
      step = 3; render();
    });
  }

  /* ---------- Step 3 ---------- */
  var filter = 'all';
  function stepPreview(){
    var c = counts();
    document.getElementById('stepBody').innerHTML =
      '<div class="mini-kpi" style="margin-bottom:18px">'+
        '<div class="stat"><div class="lab">Rows read</div><div class="val">'+c.total+'</div><div class="sub">from '+fileName+'</div></div>'+
        '<div class="stat"><div class="lab">Will change stock</div><div class="val">'+c.changed+'</div><div class="sub"><span class="diff-up">'+c.up+' up</span> · <span class="diff-down">'+c.down+' down</span></div></div>'+
        '<div class="stat"><div class="lab">New colourway</div><div class="val">'+c.newcolor+'</div><div class="sub">needs a colour added to the item</div></div>'+
        '<div class="stat"><div class="lab">Unmatched</div><div class="val" style="color:'+(c.unmatched?'var(--bad)':'inherit')+'">'+c.unmatched+'</div><div class="sub">parent SKU not in the mapping table</div></div>'+
      '</div>'+

      '<div class="adm-toolbar">'+
        '<div class="seg" id="filterSeg">'+
          '<button class="'+(filter==='all'?'is-active':'')+'" data-f="all">All rows</button>'+
          '<button class="'+(filter==='changed'?'is-active':'')+'" data-f="changed">Changes only</button>'+
          '<button class="'+(filter==='problem'?'is-active':'')+'" data-f="problem">Needs attention ('+(c.unmatched+c.newcolor)+')</button>'+
        '</div>'+
        '<div class="spacer"></div>'+
        '<button class="btn btn-outline btn-sm" id="expPrev">Export preview</button>'+
        '<button class="btn btn-primary btn-sm" id="toApply">Continue to apply</button>'+
      '</div>'+

      '<div class="panel"><div class="table-wrap"><table class="table adm-table" id="prevTable"></table></div></div>'+
      '<div class="adm-note" style="margin-top:12px">The <b>Parent SKU</b> column exists only on this screen. Customers see the item number beside it, on the site and on every document.</div>';

    paintPreview();
    document.getElementById('filterSeg').addEventListener('click', function(e){
      var b=e.target.closest('button[data-f]'); if(!b) return;
      filter=b.dataset.f; stepPreview();
    });
    document.getElementById('toApply').addEventListener('click', function(){ step=4; render(); });
    document.getElementById('expPrev').addEventListener('click', function(){
      U.download('import-preview.csv', U.csv(
        [['Parent SKU','Item number','Description','Colour','Warehouse','On hand now','From sheet','Change','FOB','Status']].concat(
          rows.map(function(r){
            return [r.parentSku, r.sku||'', r.raw.DESCRIPTION, r.colorLabel, r.wh, r.old, r.neu,
                    r.status==='unmatched'?'':(r.delta>0?'+':'')+r.delta, r.cost, r.status];
          }))
      ));
      TBM.toast('Preview exported');
    });
  }

  function paintPreview(){
    var list = rows.filter(function(r){
      if (filter==='changed') return r.status!=='unmatched' && r.delta!==0;
      if (filter==='problem') return r.status!=='ok';
      return true;
    });
    document.getElementById('prevTable').innerHTML =
      '<thead><tr>'+
        '<th style="color:var(--bad)">Parent SKU</th><th style="color:var(--ok)">Item number</th>'+
        '<th>Description</th><th>Colour</th><th>Warehouse</th>'+
        '<th class="num">On hand</th><th class="num">From sheet</th><th class="num">Change</th>'+
        '<th class="num">FOB</th><th>Status</th><th></th></tr></thead><tbody>'+
      list.map(function(r){
        var flag = r.status==='ok'
          ? '<span class="rowflag" style="color:var(--ok)">'+I.check+'Ready</span>'
          : r.status==='newcolor'
          ? '<span class="rowflag" style="color:var(--warn)">'+I.sparkle+'New colour</span>'
          : '<span class="rowflag" style="color:var(--bad)">'+I.x+'No match</span>';
        var chg = r.status==='unmatched' ? '<span class="muted">—</span>'
          : r.delta>0 ? '<span class="diff-up">+'+TBM.num(r.delta)+'</span>'
          : r.delta<0 ? '<span class="diff-down">'+TBM.num(r.delta)+'</span>'
          : '<span class="diff-same">no change</span>';
        return '<tr'+(r.status!=='ok'?' style="background:#FFFBF4"':'')+'>'+
          '<td class="sku-parent nw">'+r.parentSku+'</td>'+
          '<td class="nw">'+(r.sku ? '<a class="lk mono" href="../product/?sku='+r.sku+'">'+r.sku+'</a>' : '<span class="muted">unmapped</span>')+'</td>'+
          '<td><span class="trunc" style="max-width:230px">'+r.raw.DESCRIPTION+'</span></td>'+
          '<td class="nw">'+(r.colorKey
              ? '<span class="row" style="gap:7px"><span class="swatch" style="width:16px;height:16px;background:'+B.color(r.colorKey).body+'"></span>'+B.color(r.colorKey).name+'</span>'
              : '<span class="muted">'+r.colorLabel+'</span>')+'</td>'+
          '<td class="nw">'+r.wh+'</td>'+
          '<td class="num muted">'+(r.status==='unmatched'?'—':TBM.num(r.old))+'</td>'+
          '<td class="num"><b>'+TBM.num(r.neu)+'</b></td>'+
          '<td class="num">'+chg+'</td>'+
          '<td class="num muted">'+TBM.usd(r.cost)+'</td>'+
          '<td class="nw">'+flag+'</td>'+
          '<td class="num">'+(r.status==='ok' ? '' :
            '<button class="btn btn-outline btn-sm" data-fix="'+r.i+'">'+(r.status==='unmatched'?'Map SKU':'Add colour')+'</button>')+'</td>'+
        '</tr>';
      }).join('')+'</tbody>';

    document.querySelectorAll('[data-fix]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = rows.filter(function(x){ return x.i === +b.dataset.fix; })[0];
        if (r.status==='unmatched'){
          var next = 'DS' + (4680 + (r.i % 20) + 5);
          r.sku = next; r.status='ok'; r.old = 0;
          TBM.toast(r.parentSku + ' mapped to new item number ' + next);
        } else {
          r.colorKey = 'rust'; r.status='ok';
          TBM.toast(r.colorLabel + ' added to ' + r.sku + ' as a stock colour');
        }
        stepPreview();
      });
    });
  }

  /* ---------- Step 4 ---------- */
  function stepApply(){
    var c = counts();
    if (applied){
      document.getElementById('stepBody').innerHTML =
        '<div class="panel"><div class="panel-body" style="text-align:center;padding:52px 20px">'+
          '<div style="width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 20px"><span style="width:30px;height:30px;display:block">'+I.check+'</span></div>'+
          '<h3 class="h3" style="margin-bottom:10px">Import applied</h3>'+
          '<p class="muted" style="max-width:52ch;margin:0 auto 8px">'+applied.updated+' items updated across '+applied.warehouses+' warehouses. The new quantities are live on the storefront now.</p>'+
          '<p class="small muted" style="max-width:52ch;margin:0 auto 22px">Reference '+applied.id+' · rolled back with one click for 30 days.</p>'+
          '<div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">'+
            '<a class="btn btn-primary" href="../inventory/">Open stock</a>'+
            '<button class="btn btn-outline" id="again">Import another file</button>'+
            '<button class="btn btn-ghost" id="rollback" style="color:var(--bad)">Roll this back</button>'+
          '</div>'+
        '</div></div>';
      document.getElementById('again').addEventListener('click', function(){ step=1; rows=[]; applied=null; render(); });
      document.getElementById('rollback').addEventListener('click', function(){
        TBM.toast('Import ' + applied.id + ' rolled back — stock restored to the previous values');
        applied=null; step=1; rows=[]; render();
      });
      return;
    }

    document.getElementById('stepBody').innerHTML =
      '<div class="adm-split">'+
        '<div class="panel">'+
          '<div class="panel-head"><h3>Ready to apply</h3><span class="badge">'+fileName+'</span></div>'+
          '<div class="panel-body">'+
            '<div class="summary-row"><span class="muted">Import type</span><span class="v">'+(KINDS.filter(function(k){return k[0]===kind;})[0]||KINDS[0])[1]+'</span></div>'+
            '<div class="summary-row"><span class="muted">Rows read</span><span class="v">'+c.total+'</span></div>'+
            '<div class="summary-row"><span class="muted">Stock quantities to change</span><span class="v">'+c.changed+'</span></div>'+
            '<div class="summary-row"><span class="muted">Increases</span><span class="v diff-up">'+c.up+'</span></div>'+
            '<div class="summary-row"><span class="muted">Decreases</span><span class="v diff-down">'+c.down+'</span></div>'+
            '<div class="summary-row"><span class="muted">Unmatched, will be skipped</span><span class="v">'+c.unmatched+'</span></div>'+
            '<div class="summary-row total"><span>Items updated</span><b>'+(c.ok+c.newcolor)+'</b></div>'+

            '<div style="margin-top:22px;display:grid;gap:12px">'+
              '<label class="check"><input type="checkbox" checked><span><b style="font-size:.875rem">Publish quantities to the storefront immediately</b><span class="small muted" style="display:block">Uncheck to stage the change and release it manually.</span></span></label>'+
              '<label class="check"><input type="checkbox" checked><span><b style="font-size:.875rem">Skip rows that could not be matched</b><span class="small muted" style="display:block">The alternative is to stop the whole import — we never guess a SKU.</span></span></label>'+
              '<label class="check"><input type="checkbox" checked><span><b style="font-size:.875rem">Email a summary to the inventory desk</b><span class="small muted" style="display:block">Goes to renu@tbm.com and the ops distribution list.</span></span></label>'+
              '<label class="check"><input type="checkbox"><span><b style="font-size:.875rem">Notify customers watching low-stock items</b><span class="small muted" style="display:block">Only fires where stock crosses back above a customer’s alert threshold.</span></span></label>'+
            '</div>'+

            '<div class="note-box" style="margin-top:20px">'+I.shield+
              '<span>This writes quantities only. No customer price, rate card or tier is touched by a stock import — those live in <a href="../pricing/" style="color:var(--forest);text-decoration:underline">Rate cards</a>.</span></div>'+

            '<button class="btn btn-primary btn-lg btn-block" id="applyBtn" style="margin-top:22px">Apply import to '+(c.ok+c.newcolor)+' items</button>'+
          '</div>'+
        '</div>'+

        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>Biggest movements</h3></div><div class="panel-body" id="moves"></div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Skipped rows</h3></div><div class="panel-body">'+
            (c.unmatched
              ? rows.filter(function(r){return r.status==='unmatched';}).map(function(r){
                  return '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)">'+
                    '<span style="color:var(--bad);flex:none;width:16px">'+I.x+'</span>'+
                    '<span><b class="mono" style="font-size:.75rem">'+r.parentSku+'</b>'+
                    '<span class="small muted" style="display:block">'+r.raw.DESCRIPTION+'</span></span></div>';
                }).join('') + '<div class="hint" style="margin-top:12px">Map these on the preview step, or in <a href="../products/" style="color:var(--forest);text-decoration:underline">Products &amp; SKUs</a>.</div>'
              : '<p class="small muted" style="margin:0">Nothing skipped — every row matched an item number.</p>')+
          '</div></div>'+
        '</div>'+
      '</div>';

    var moves = rows.filter(function(r){ return r.status!=='unmatched' && r.delta!==0; })
      .sort(function(a,b){ return Math.abs(b.delta)-Math.abs(a.delta); }).slice(0,8);
    document.getElementById('moves').innerHTML = U.barList(moves.map(function(r){
      return { label:r.product.name, mono:r.sku+' · '+r.wh, value:Math.abs(r.delta),
        display: (r.delta>0?'+':'')+TBM.num(r.delta), sub: TBM.num(r.old)+' → '+TBM.num(r.neu) };
    }), { narrow:true });

    document.getElementById('applyBtn').addEventListener('click', function(){
      var whs = {};
      rows.forEach(function(r){ if (r.status!=='unmatched') whs[r.wh]=1; });
      /* write it into the live catalog so the rest of the prototype reflects it */
      rows.forEach(function(r){
        if (r.status==='unmatched' || !r.product) return;
        r.product.stock[r.wh] = r.neu;
      });
      applied = {
        id: 'IMP-' + Date.now().toString().slice(-8),
        updated: counts().ok + counts().newcolor,
        warehouses: Object.keys(whs).length
      };
      TBM.toast('Import applied — ' + applied.updated + ' items updated');
      render();
    });
  }

  /* ---------- Scheduled panel ---------- */
  var schedOpen = false;
  function toggleSched(){
    schedOpen = !schedOpen;
    var el = document.getElementById('schedPanel');
    el.classList.toggle('hide', !schedOpen);
    if (!schedOpen) return;
    el.innerHTML =
      '<div class="panel" style="margin-top:20px">'+
        '<div class="panel-head"><h3>Scheduled imports</h3><span class="badge badge-ok"><i class="dot"></i>2 active</span></div>'+
        '<div class="panel-body">'+
          '<div class="table-wrap"><table class="table adm-table">'+
            '<thead><tr><th>Feed</th><th>Source</th><th>Runs</th><th>Mapping</th><th>Last run</th><th>Status</th><th></th></tr></thead><tbody>'+
            [['Mill stock — daily','SFTP mill-a/outbound/*.xlsx','06:15 PT, every day','MILL_REF standard','Today 06:15','Active'],
             ['Mill cost — weekly','SFTP mill-a/outbound/cost-*.csv','Mondays 06:30 PT','FOB standard','Mon 06:30','Active'],
             ['Rate card — on demand','Manual upload','—','Per account','23 Aug','Paused']].map(function(r){
              return '<tr><td><b>'+r[0]+'</b></td><td class="mono" style="font-size:.6875rem">'+r[1]+'</td>'+
                '<td>'+r[2]+'</td><td class="muted">'+r[3]+'</td><td class="muted">'+r[4]+'</td>'+
                '<td><span class="badge '+(r[5]==='Active'?'badge-ok':'')+'">'+r[5]+'</span></td>'+
                '<td class="num"><label class="sw"><input type="checkbox" '+(r[5]==='Active'?'checked':'')+'><span class="track"></span></label></td></tr>';
            }).join('')+'</tbody></table></div>'+
          '<div class="note-box" style="margin-top:16px">'+I.clock+
            '<span>A scheduled run uses the saved column mapping and applies automatically. Rows it cannot match are held for review and appear on the dashboard rather than being guessed.</span></div>'+
        '</div>'+
      '</div>';
  }

  /* ---------- History ---------- */
  function paintHistory(){
    document.getElementById('histTable').innerHTML =
      '<thead><tr><th>Reference</th><th>Date</th><th>File</th><th>Type</th><th class="num">Rows</th><th class="num">Updated</th><th class="num">Warnings</th><th>Run by</th><th>Status</th><th></th></tr></thead><tbody>'+
      A.IMPORTS.map(function(x){
        return '<tr><td class="mono nw">'+x.id+'</td>'+
          '<td class="nw">'+U.fmtDate(x.date)+'</td>'+
          '<td><span class="trunc mono" style="max-width:240px;font-size:.6875rem">'+x.file+'</span></td>'+
          '<td><span class="badge">'+x.kind+'</span></td>'+
          '<td class="num">'+x.rows+'</td><td class="num">'+x.updated+'</td>'+
          '<td class="num '+(x.warnings?'':'muted')+'">'+x.warnings+'</td>'+
          '<td class="muted nw">'+x.by+'</td>'+
          '<td class="nw"><span class="badge '+(x.warnings>2?'badge-warn':'badge-ok')+'">'+x.status+'</span></td>'+
          '<td class="num"><button class="btn btn-outline btn-sm" data-undo="'+x.id+'">Roll back</button></td></tr>';
      }).join('')+'</tbody>';

    document.querySelectorAll('[data-undo]').forEach(function(b){
      b.addEventListener('click', function(){
        TBM.toast('Import ' + b.dataset.undo + ' rolled back — stock restored to the prior values');
      });
    });
  }

  render();
})();
</script>
</body>
</html>
