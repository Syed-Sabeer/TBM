<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Settings — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin;

  var mount = U.renderShell('settings', 'Settings', 'Staff, documents and integrations');
  var tab = 'staff';

  function shell(){
    mount.innerHTML =
      '<div class="adm-head">'+
        '<div><h2>Settings</h2><p>Who can get into the back office, what the customer-facing documents say, and where the data comes in and out.</p></div>'+
        '<button class="btn btn-primary" id="save">Save</button>'+
      '</div>'+
      '<div class="adm-tabs" id="tabs">'+
        [['staff','Staff & roles'],['docs','Documents & numbering'],['store','Storefront'],['integrations','Integrations'],['audit','Audit log']]
          .map(function(t){ return '<button class="'+(tab===t[0]?'is-active':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'; }).join('')+
      '</div><div id="tabBody"></div>';

    document.getElementById('tabs').addEventListener('click', function(e){
      var b=e.target.closest('button[data-t]'); if(!b) return; tab=b.dataset.t; shell();
    });
    document.getElementById('save').addEventListener('click', function(){ TBM.toast('Settings saved'); });
    ({staff:tabStaff, docs:tabDocs, store:tabStore, integrations:tabInt, audit:tabAudit})[tab]();
  }

  function tabStaff(){
    document.getElementById('tabBody').innerHTML =
      '<div class="panel" style="margin-bottom:20px">'+
        '<div class="panel-head"><h3>Back-office logins</h3><button class="btn btn-outline btn-sm" id="inv">Invite staff</button></div>'+
        '<div class="table-wrap"><table class="table adm-table" id="sTbl"></table></div>'+
      '</div>'+
      '<div class="adm-split">'+
        '<div class="panel"><div class="panel-head"><h3>What each role can do</h3></div>'+
          '<div class="table-wrap"><table class="table table-compact adm-table" id="permTbl"></table></div></div>'+
        '<div class="panel"><div class="panel-head"><h3>Security</h3></div><div class="panel-body" style="display:grid;gap:12px">'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Require two-factor for Owner and Finance</label>'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Log every rate card view and export</label>'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Sign out idle sessions after 8 hours</label>'+
          '<label class="sw"><input type="checkbox"><span class="track"></span>Restrict admin access by IP range</label>'+
          '<div class="note-box" style="margin-top:6px">'+I.lock+
            '<span>Rate cards are the most sensitive data in this system. Exports are watermarked with the staff member’s name and timestamp.</span></div>'+
        '</div></div>'+
      '</div>';

    document.getElementById('sTbl').innerHTML =
      '<thead><tr><th>Staff member</th><th>Role</th><th>Rate cards</th><th>Imports</th><th>Last active</th><th></th></tr></thead><tbody>'+
      A.STAFF.map(function(s){
        var full = s.role==='Owner';
        return '<tr><td><div class="user-row"><span class="av">'+s.init+'</span>'+
            '<span><b>'+s.name+(s.email===U.admin().email?' <span class="badge" style="height:18px">You</span>':'')+'</b><span>'+s.email+'</span></span></div></td>'+
          '<td><select class="select" style="height:32px;font-size:.75rem;width:auto">'+
            ['Owner','Account Manager','Quality & Inventory','East Coast Ops','Customer Care','Decoration Manager','Finance']
              .map(function(r){ return '<option '+(s.role===r?'selected':'')+'>'+r+'</option>'; }).join('')+'</select></td>'+
          '<td><label class="sw"><input type="checkbox" '+(full||s.role==='Account Manager'?'checked':'')+'><span class="track"></span></label></td>'+
          '<td><label class="sw"><input type="checkbox" '+(full||s.role==='Quality & Inventory'?'checked':'')+'><span class="track"></span></label></td>'+
          '<td class="muted nw">'+s.last+'</td>'+
          '<td class="num"><div class="rowact"><button class="btn btn-outline btn-sm">Reset password</button>'+
            '<button class="btn btn-ghost btn-sm" style="color:var(--bad)" '+(s.role==='Owner'?'disabled':'')+'>Remove</button></div></td></tr>';
      }).join('')+'</tbody>';

    document.getElementById('permTbl').innerHTML =
      '<thead><tr><th>Capability</th><th>Owner</th><th>Account Mgr</th><th>Inventory</th><th>Care</th></tr></thead><tbody>'+
      [['See rate cards',1,1,0,1],['Change a tier',1,0,0,0],['Set an item override',1,1,0,0],
       ['Approve an account',1,1,0,1],['Confirm an order',1,1,1,1],['Run an import',1,0,1,0],
       ['Adjust stock',1,0,1,0],['Create a warehouse',1,0,1,0],['See FOB cost and margin',1,1,1,0],
       ['Export customer data',1,1,0,0]].map(function(r){
        return '<tr><td>'+r[0]+'</td>'+r.slice(1).map(function(v){
          return '<td>'+(v?'<span style="color:var(--ok);width:16px;display:inline-block">'+I.check+'</span>':'<span class="muted">—</span>')+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody>';

    document.getElementById('inv').addEventListener('click', function(){ TBM.toast('Invitation sent — they set their own password'); });
  }

  function tabDocs(){
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-split">'+
        '<div>'+
          '<div class="panel" style="margin-bottom:20px"><div class="panel-head"><h3>Numbering</h3></div><div class="panel-body">'+
            '<div class="field-row">'+
              '<div class="field"><label class="label">Order prefix</label><input class="input mono" value="TBM-"></div>'+
              '<div class="field"><label class="label">Next order number</label><input class="input mono" value="3461"></div>'+
            '</div>'+
            '<div class="field-row" style="margin-top:16px">'+
              '<div class="field"><label class="label">Invoice prefix</label><input class="input mono" value="INV-"></div>'+
              '<div class="field"><label class="label">Customer item prefix</label><input class="input mono" value="DS"></div>'+
            '</div>'+
            '<div class="hint" style="margin-top:12px">New items are assigned the next free number in the DS series. The mill reference is entered separately and is never derived from it.</div>'+
          '</div></div>'+

          '<div class="panel"><div class="panel-head"><h3>What prints on customer documents</h3></div><div class="panel-body">'+
            '<div style="display:grid;gap:12px">'+
              '<label class="sw"><input type="checkbox" checked disabled><span class="track"></span>Customer item number <span class="badge badge-ok" style="margin-left:8px">Always</span></label>'+
              '<label class="sw"><input type="checkbox"><span class="track"></span>Parent / mill SKU <span class="badge badge-bad" style="margin-left:8px">Off by design</span></label>'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Colour name</label>'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Size and fabric weight</label>'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Customer PO number</label>'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Decoration method and location</label>'+
              '<label class="sw"><input type="checkbox"><span class="track"></span>Country of origin per line</label>'+
              '<label class="sw"><input type="checkbox"><span class="track"></span>FOB cost <span class="badge badge-bad" style="margin-left:8px">Never</span></label>'+
            '</div>'+
            '<div class="note-box" style="margin-top:18px">'+I.shield+
              '<span>The parent SKU toggle is deliberately hard to turn on. It is the one setting that would leak a mill reference to a customer, and the pick list already carries it for the floor.</span></div>'+
          '</div></div>'+
        '</div>'+

        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>Packing slip preview</h3></div><div class="panel-body">'+
            '<div style="border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;font-size:.75rem">'+
              '<div style="display:flex;justify-content:space-between;margin-bottom:12px">'+
                '<b style="font-family:var(--f-display);font-size:1rem">TBM</b>'+
                '<span class="mono">TBM-2026-3455</span></div>'+
              '<table style="width:100%;font-size:.6875rem"><thead><tr style="border-bottom:1px solid var(--line)">'+
                '<th style="text-align:left;padding:5px 0">Item</th><th style="text-align:left">Description</th><th style="text-align:right">Qty</th></tr></thead><tbody>'+
                '<tr><td class="mono" style="padding:6px 0">DS4500</td><td>All-Day Organic Cotton Tote, Natural</td><td style="text-align:right">2,500</td></tr>'+
                '<tr><td class="mono" style="padding:6px 0">DS4600</td><td>Organic Cotton Drawstring Backpack, Forest</td><td style="text-align:right">1,000</td></tr>'+
              '</tbody></table>'+
              '<div style="margin-top:12px;color:var(--muted)">No mill references appear on this document.</div>'+
            '</div>'+
          '</div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Pick list preview</h3></div><div class="panel-body">'+
            '<div style="border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;font-size:.75rem">'+
              '<b style="font-size:.8125rem">Warehouse pick — LAX</b>'+
              '<table style="width:100%;font-size:.6875rem;margin-top:10px"><thead><tr style="border-bottom:1px solid var(--line)">'+
                '<th style="text-align:left;padding:5px 0">Mill ref</th><th style="text-align:left">Bin</th><th style="text-align:right">Qty</th></tr></thead><tbody>'+
                '<tr><td class="mono" style="padding:6px 0;color:var(--bad)">BPK18</td><td>A-14-3</td><td style="text-align:right">2,500</td></tr>'+
                '<tr><td class="mono" style="padding:6px 0;color:var(--bad)">BPK80</td><td>C-02-1</td><td style="text-align:right">1,000</td></tr>'+
              '</tbody></table>'+
              '<div style="margin-top:12px;color:var(--muted)">Internal only. Never leaves the building.</div>'+
            '</div>'+
          '</div></div>'+
        '</div>'+
      '</div>';
  }

  function tabStore(){
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-split">'+
        '<div class="panel"><div class="panel-head"><h3>Pricing visibility</h3></div><div class="panel-body">'+
          '<div style="display:grid;gap:12px">'+
            '<label class="sw"><input type="checkbox" checked disabled><span class="track"></span>Hide all pricing from signed-out visitors <span class="badge badge-ok" style="margin-left:8px">Core</span></label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Let signed-out visitors browse the catalog and build an order</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Show a masked quantity-break table to signed-out visitors</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Hold pricing when a resale certificate expires</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Show live stock quantities to signed-in accounts</label>'+
            '<label class="sw"><input type="checkbox"><span class="track"></span>Show stock quantities to signed-out visitors</label>'+
          '</div>'+
          '<hr style="margin:24px 0">'+
          '<h4 style="font-family:var(--f-sans);font-size:.875rem;font-weight:700;margin-bottom:14px">Checkout</h4>'+
          '<div style="display:grid;gap:12px">'+
            '<label class="sw"><input type="checkbox" checked disabled><span class="track"></span>No payment gateway — invoice on account <span class="badge badge-ok" style="margin-left:8px">Core</span></label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Require a customer PO number over $5,000</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Block checkout when an account is over its credit limit</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Allow split shipment across warehouses</label>'+
            '<label class="sw"><input type="checkbox"><span class="track"></span>Auto-confirm orders under $1,000 from Tier A accounts</label>'+
          '</div>'+
        '</div></div>'+
        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>Lead times shown on the site</h3></div><div class="panel-body">'+
            '<div class="field"><label class="label">Blank stock dispatch</label><input class="input" value="48 hours"></div>'+
            '<div class="field"><label class="label">Screen print</label><input class="input" value="5–7 working days"></div>'+
            '<div class="field"><label class="label">Embroidery</label><input class="input" value="8–10 working days"></div>'+
            '<div class="field"><label class="label">Custom production</label><input class="input" value="45–60 days FOB"></div>'+
          '</div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Account applications</h3></div><div class="panel-body">'+
            '<div style="display:grid;gap:12px">'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Require a resale certificate before approval</label>'+
              '<label class="sw"><input type="checkbox" checked><span class="track"></span>Start every new account on Tier C</label>'+
              '<label class="sw"><input type="checkbox"><span class="track"></span>Auto-approve applications with a verified EIN</label>'+
            '</div>'+
            '<div class="field" style="margin-top:16px"><label class="label">Applications go to</label>'+
              '<input class="input" value="accounts@tbm.com"></div>'+
          '</div></div>'+
        '</div>'+
      '</div>';
  }

  function tabInt(){
    document.getElementById('tabBody').innerHTML =
      '<div class="panel"><div class="panel-head"><h3>Connections</h3>'+
        '<button class="btn btn-outline btn-sm">Add a connection</button></div>'+
        '<div class="table-wrap"><table class="table adm-table">'+
          '<thead><tr><th>System</th><th>What it does</th><th>Direction</th><th>Last sync</th><th>Status</th><th></th></tr></thead><tbody>'+
          [['Mill SFTP','Daily stock and weekly cost sheets','In','Today 06:15','Connected'],
           ['Accounting','Invoices, credit limits and payment status','Out','Today 07:00','Connected'],
           ['Carrier rating','Freight quotes at checkout','Both','Today 09:42','Connected'],
           ['Warehouse WMS — LAX','Pick, pack and stock movements','Both','Today 09:50','Connected'],
           ['Warehouse WMS — EWR','Pick, pack and stock movements','Both','Today 09:48','Connected'],
           ['3PL — DFW','Stock file, twice daily','In','Today 06:00','Connected'],
           ['Email','Order acknowledgements and shipment notices','Out','Today 09:51','Connected'],
           ['Decoration MIS','Art files, proofs and press schedule','Both','—','Not connected']].map(function(r){
            return '<tr><td><b>'+r[0]+'</b></td><td class="muted">'+r[1]+'</td>'+
              '<td><span class="badge">'+r[2]+'</span></td><td class="muted nw">'+r[3]+'</td>'+
              '<td><span class="badge '+(r[4]==='Connected'?'badge-ok':'')+'">'+r[4]+'</span></td>'+
              '<td class="num"><button class="btn btn-outline btn-sm">'+(r[4]==='Connected'?'Configure':'Connect')+'</button></td></tr>';
          }).join('')+'</tbody></table></div>'+
      '</div>'+
      '<div class="adm-split" style="margin-top:20px">'+
        '<div class="panel"><div class="panel-head"><h3>API</h3></div><div class="panel-body">'+
          '<p class="small muted">Larger accounts pull stock and submit orders programmatically instead of using the site.</p>'+
          '<div class="field" style="margin-top:14px"><label class="label">Base URL</label>'+
            '<input class="input mono" value="https://api.tbm.com/v1" disabled></div>'+
          '<div class="field"><label class="label">Keys issued</label><input class="input" value="4 active" disabled></div>'+
          '<div class="note-box" style="margin-top:14px">'+I.lock+
            '<span>A key is scoped to one account. It returns that account’s prices and nothing else — the same gate the website uses.</span></div>'+
        '</div></div>'+
        '<div class="panel"><div class="panel-head"><h3>Data retention</h3></div><div class="panel-body" style="display:grid;gap:12px">'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Keep import history for 30 days of rollback</label>'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Keep order history indefinitely</label>'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Purge decoration artwork 24 months after the last run</label>'+
          '<label class="sw"><input type="checkbox" checked><span class="track"></span>Nightly off-site backup</label>'+
        '</div></div>'+
      '</div>';
  }

  function tabAudit(){
    var rows = A.ACTIVITY.concat([
      ['Rate card exported','Northline Supply Co. rate card exported to CSV','Jordan Alvarez','Yesterday 16:20'],
      ['Tier changed','Gulf Coast Merch moved from Tier C to Tier B','Maya Castellanos','Yesterday 14:02'],
      ['Stock corrected','DS4545 LAX 3,800 → 3,640, reason: cycle count','Renu Kapoor','Yesterday 11:35'],
      ['Order cancelled','TBM-2026-3390 cancelled at the customer’s request','Amara Hale','11 Sep 15:10'],
      ['Warehouse created','Dallas, TX added as a stocking location','Renu Kapoor','2 Sep 09:00'],
      ['Account on hold','Verdant Grocery Co-op — certificate expired','System','1 Sep 06:00']
    ]);
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-toolbar">'+
        '<div class="field" style="flex:1"><label class="label">Search the log</label><input class="input" placeholder="User, action or record"></div>'+
        '<div class="field"><label class="label">Type</label><select class="select">'+
          '<option>Everything</option><option>Pricing changes</option><option>Stock changes</option>'+
          '<option>Account changes</option><option>Exports</option></select></div>'+
        '<div class="spacer"></div><button class="btn btn-outline btn-sm" id="expA">Export log</button>'+
      '</div>'+
      '<div class="panel"><div class="table-wrap"><table class="table adm-table">'+
        '<thead><tr><th>Action</th><th>Detail</th><th>By</th><th>When</th></tr></thead><tbody>'+
        rows.map(function(r){
          return '<tr><td class="nw"><b>'+r[0]+'</b></td><td class="muted">'+r[1]+'</td>'+
            '<td class="nw">'+r[2]+'</td><td class="nw muted">'+r[3]+'</td></tr>';
        }).join('')+'</tbody></table></div></div>'+
      '<div class="adm-note" style="margin-top:12px">Every price change, stock correction, export and account change is recorded against a named person. The log cannot be edited from inside the application.</div>';

    document.getElementById('expA').addEventListener('click', function(){
      U.download('tbm-audit-log.csv', U.csv([['Action','Detail','By','When']].concat(rows)));
      TBM.toast('Audit log exported');
    });
  }

  shell();
})();
</script>
</body>
</html>
