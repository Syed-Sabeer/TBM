<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Customers — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin;

  var mount = U.renderShell('customers', 'Customers', 'Accounts, rate cards and logins');
  var f = { q: TBM.qp('q') || '', status:'', tier:'', rep:'' };

  var stats = {};
  A.byCompany().forEach(function(x){ stats[x.key] = x; });

  mount.innerHTML =
    '<div class="adm-head">'+
      '<div><h2>Customers</h2><p>One company, one rate card, many logins. Pricing is set here and every contact on the account inherits it — there is no per-user price anywhere in the system.</p></div>'+
      '<div class="row" style="gap:10px">'+
        '<button class="btn btn-outline" id="exp">Export CSV</button>'+
        '<button class="btn btn-primary" id="newCo">New account</button>'+
      '</div>'+
    '</div>'+
    '<div id="pendingMount"></div>'+
    '<div class="mini-kpi" id="kpis" style="margin-bottom:18px"></div>'+
    '<div class="adm-toolbar">'+
      '<div class="field" style="flex:1;min-width:200px"><label class="label" for="fq">Search</label>'+
        '<input class="input" id="fq" type="search" placeholder="Company, account number or city"></div>'+
      '<div class="field"><label class="label" for="fStatus">Status</label>'+
        '<select class="select" id="fStatus"><option value="">All</option><option>Active</option><option>On hold</option><option>Pending approval</option></select></div>'+
      '<div class="field"><label class="label" for="fTier">Rate card</label>'+
        '<select class="select" id="fTier"><option value="">All tiers</option>'+
        ['A','B','C'].map(function(t){ return '<option value="'+t+'">'+D.TIERS[t].name+'</option>'; }).join('')+'</select></div>'+
      '<div class="field"><label class="label" for="fRep">Rep</label><select class="select" id="fRep"></select></div>'+
      '<div class="spacer"></div>'+
      '<button class="btn btn-ghost btn-sm" id="clear">Clear</button>'+
    '</div>'+
    '<div class="panel">'+
      '<div class="panel-head"><h3 id="count"></h3><span class="small muted">Spend is the last 12 months at each account’s own rates</span></div>'+
      '<div class="table-wrap"><table class="table adm-table" id="tbl"></table></div>'+
    '</div>';

  var reps = [];
  A.COMPANIES.forEach(function(c){ if (reps.indexOf(c.rep)<0) reps.push(c.rep); });
  document.getElementById('fRep').innerHTML = '<option value="">All reps</option>'+
    reps.map(function(r){ return '<option>'+r+'</option>'; }).join('');
  document.getElementById('fq').value = f.q;

  function filtered(){
    var q = f.q.trim().toLowerCase();
    return A.COMPANIES.filter(function(c){
      if (f.status && c.status!==f.status) return false;
      if (f.tier && c.tier!==f.tier) return false;
      if (f.rep && c.rep!==f.rep) return false;
      if (q && (c.name+' '+c.id+' '+c.city+' '+c.state).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }

  function paint(){
    var list = filtered();
    var pending = A.COMPANIES.filter(function(c){ return c.status==='Pending approval'; });

    document.getElementById('pendingMount').innerHTML = pending.length
      ? '<div class="panel" style="margin-bottom:18px;border-color:var(--kraft)">'+
          '<div class="panel-head" style="background:var(--kraft-100)"><h3>'+pending.length+' accounts waiting for approval</h3>'+
            '<span class="small muted">No pricing is visible to them until you approve</span></div>'+
          '<div class="table-wrap"><table class="table table-compact adm-table"><thead><tr>'+
            '<th>Company</th><th>Applied</th><th>Location</th><th>Certificate</th><th>Assign rep</th><th>Rate card</th><th></th></tr></thead><tbody>'+
            pending.map(function(c){
              return '<tr><td><b>'+c.name+'</b><div class="small muted">'+c.id+'</div></td>'+
                '<td class="nw">'+c.since+'</td><td class="nw">'+c.city+', '+c.state+'</td>'+
                '<td><span class="badge badge-warn">'+c.cert+'</span></td>'+
                '<td><select class="select" style="height:34px;font-size:.75rem;width:auto">'+
                  reps.filter(function(r){return r!=='Unassigned';}).map(function(r){ return '<option>'+r+'</option>'; }).join('')+'</select></td>'+
                '<td><select class="select" data-tier="'+c.id+'" style="height:34px;font-size:.75rem;width:auto">'+
                  ['C','B','A'].map(function(t){ return '<option value="'+t+'">'+D.TIERS[t].name+'</option>'; }).join('')+'</select></td>'+
                '<td class="num"><div class="rowact">'+
                  '<button class="btn btn-primary btn-sm" data-approve="'+c.id+'">Approve</button>'+
                  '<button class="btn btn-ghost btn-sm" data-reject="'+c.id+'">Decline</button>'+
                '</div></td></tr>';
            }).join('')+'</tbody></table></div>'+
        '</div>'
      : '';

    var active = A.COMPANIES.filter(function(c){ return c.status==='Active'; });
    var totalSpend = Object.keys(stats).reduce(function(s,k){ return s+stats[k].spend; },0);
    var seats = A.COMPANIES.reduce(function(s,c){ return s+c.seats; },0);
    document.getElementById('kpis').innerHTML =
      '<div class="stat"><div class="lab">Accounts</div><div class="val">'+A.COMPANIES.length+'</div><div class="sub">'+active.length+' active</div></div>'+
      '<div class="stat"><div class="lab">Logins</div><div class="val">'+seats+'</div><div class="sub">across all accounts, no seat charge</div></div>'+
      '<div class="stat"><div class="lab">Revenue, 12 months</div><div class="val">'+TBM.usd(totalSpend)+'</div><div class="sub">all accounts</div></div>'+
      '<div class="stat"><div class="lab">Negotiated overrides</div><div class="val">'+
        A.COMPANIES.reduce(function(s,c){ return s+Object.keys(c.overrides).length; },0)+'</div>'+
        '<div class="sub">item-level, on top of tier</div></div>';

    document.getElementById('count').textContent = list.length+' account'+(list.length===1?'':'s');

    document.getElementById('tbl').innerHTML =
      '<thead><tr><th>Account</th><th>Location</th><th>Rate card</th><th class="num">Overrides</th>'+
      '<th class="num">Logins</th><th class="num">Orders 12m</th><th class="num">Spend 12m</th>'+
      '<th>Credit</th><th>Terms</th><th>Rep</th><th>Status</th><th></th></tr></thead><tbody>'+
      list.map(function(c){
        var s = stats[c.id];
        var pct = c.limit ? Math.min(100, c.used/c.limit*100) : 0;
        return '<tr>'+
          '<td class="nw"><a class="lk" href="../customer/?id='+c.id+'">'+c.name+'</a>'+
            '<div class="small muted mono">'+c.id+'</div></td>'+
          '<td class="nw muted">'+c.city+', '+c.state+'</td>'+
          '<td class="nw"><span class="badge '+(c.tier==='A'?'badge-new':c.tier==='B'?'badge-eco':'')+'">'+D.TIERS[c.tier].name+'</span></td>'+
          '<td class="num">'+(Object.keys(c.overrides).length || '<span class="muted">—</span>')+'</td>'+
          '<td class="num">'+c.seats+'</td>'+
          '<td class="num">'+(s?s.orderCount:0)+'</td>'+
          '<td class="num"><b>'+(s?TBM.usd(s.spend):'—')+'</b></td>'+
          '<td style="min-width:110px">'+(c.limit
            ? '<span class="bar-mini"><i style="width:'+pct.toFixed(0)+'%;background:'+(pct>85?'var(--bad)':'var(--forest)')+'"></i></span>'+
              '<span class="small muted">'+TBM.usd(c.used)+' / '+TBM.usd(c.limit)+'</span>'
            : '<span class="muted small">No line</span>')+'</td>'+
          '<td class="nw muted">'+c.terms+'</td>'+
          '<td class="nw muted">'+c.rep+'</td>'+
          '<td class="nw">'+U.acctPill(c.status)+'</td>'+
          '<td class="num"><a class="btn btn-outline btn-sm" href="../customer/?id='+c.id+'">Open</a></td></tr>';
      }).join('')+'</tbody>';

    document.querySelectorAll('[data-approve]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = A.company(b.dataset.approve);
        var tierSel = document.querySelector('[data-tier="'+c.id+'"]');
        c.status='Active'; c.tier = tierSel ? tierSel.value : 'C';
        c.limit = 15000; c.cert='Verified'; c.rep = reps.filter(function(r){return r!=='Unassigned';})[0];
        TBM.toast(c.name+' approved on '+D.TIERS[c.tier].name+' — they can see pricing now');
        paint();
      });
    });
    document.querySelectorAll('[data-reject]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = A.company(b.dataset.reject);
        c.status='On hold';
        TBM.toast(c.name+' declined — no pricing released');
        paint();
      });
    });
  }

  ['fStatus','fTier','fRep'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){
      f[{fStatus:'status',fTier:'tier',fRep:'rep'}[id]] = this.value; paint();
    });
  });
  var t;
  document.getElementById('fq').addEventListener('input', function(e){
    clearTimeout(t); t=setTimeout(function(){ f.q=e.target.value; paint(); },200);
  });
  document.getElementById('clear').addEventListener('click', function(){
    f={q:'',status:'',tier:'',rep:''};
    document.getElementById('fq').value='';
    ['fStatus','fTier','fRep'].forEach(function(id){ document.getElementById(id).value=''; });
    paint();
  });
  document.getElementById('newCo').addEventListener('click', function(){
    TBM.toast('New account form — approvals normally arrive from the storefront application instead');
  });
  document.getElementById('exp').addEventListener('click', function(){
    U.download('tbm-customers.csv', U.csv(
      [['Account','Name','City','State','Tier','Overrides','Logins','Terms','Credit limit','Credit used','Rep','Status','Certificate','Cert expires','Orders 12m','Spend 12m']].concat(
        filtered().map(function(c){
          var s = stats[c.id];
          return [c.id,c.name,c.city,c.state,c.tier,Object.keys(c.overrides).length,c.seats,c.terms,c.limit,c.used,c.rep,c.status,c.cert,c.certExp,s?s.orderCount:0,(s?s.spend:0).toFixed(2)];
        }))
    ));
    TBM.toast('Customers exported');
  });

  paint();
})();
</script>
</body>
</html>
