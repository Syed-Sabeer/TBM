<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rate cards — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin, B = TBMBags;

  var mount = U.renderShell('pricing', 'Rate cards', 'Tiers, quantity breaks and per-account overrides');
  var sku = (TBM.qp('sku') || 'DS4520').toUpperCase();
  var tab = 'matrix';

  function shell(){
    mount.innerHTML =
      '<div class="adm-head">'+
        '<div><h2>Rate cards</h2><p>There is no public price list. A customer’s price is the base price times the quantity break times their tier, and then any item override negotiated against their account.</p></div>'+
        '<div class="row" style="gap:10px">'+
          '<a class="btn btn-outline" href="../import/">Import a rate card</a>'+
          '<button class="btn btn-primary" id="save">Save changes</button>'+
        '</div>'+
      '</div>'+
      '<div class="adm-tabs" id="tabs">'+
        [['matrix','Who pays what'],['tiers','Tiers & breaks'],['overrides','All overrides'],['policy','Margin policy']]
          .map(function(t){ return '<button class="'+(tab===t[0]?'is-active':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'; }).join('')+
      '</div><div id="tabBody"></div>';

    document.getElementById('tabs').addEventListener('click', function(e){
      var b=e.target.closest('button[data-t]'); if(!b) return; tab=b.dataset.t; shell();
    });
    document.getElementById('save').addEventListener('click', function(){
      TBM.toast('Rate cards saved — every signed-in customer sees the new numbers immediately');
    });

    ({matrix:tabMatrix, tiers:tabTiers, overrides:tabOverrides, policy:tabPolicy})[tab]();
  }

  /* ---------- Who pays what ---------- */
  function tabMatrix(){
    var p = D.byId(sku) || D.PRODUCTS[0];
    var cost = p.base*0.52;
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-toolbar">'+
        '<div class="field" style="min-width:260px"><label class="label" for="skuSel">Item</label>'+
          '<select class="select" id="skuSel">'+
            D.PRODUCTS.map(function(x){ return '<option value="'+x.sku+'" '+(x.sku===p.sku?'selected':'')+'>'+x.sku+' — '+x.name+'</option>'; }).join('')+
          '</select></div>'+
        '<div class="field"><label class="label" for="qtySel">At quantity</label>'+
          '<select class="select" id="qtySel">'+
            D.BREAKS.map(function(b,i){ return '<option value="'+b+'" '+(i===2?'selected':'')+'>'+TBM.num(b)+'</option>'; }).join('')+
          '</select></div>'+
        '<div class="spacer"></div>'+
        '<button class="btn btn-outline btn-sm" id="expM">Export</button>'+
      '</div>'+

      '<div class="adm-split" style="margin-bottom:20px">'+
        '<div class="panel"><div class="panel-head">'+
          '<div><h3>Every account, one item</h3><div class="small muted" style="margin-top:3px">This is what the requirement "different rates for different customers" actually looks like.</div></div>'+
          '<span class="badge">Cost '+TBM.usd(cost)+'</span></div>'+
          '<div class="table-wrap"><table class="table adm-table" id="matTbl"></table></div>'+
        '</div>'+
        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-body" style="padding:0">'+B.figure(p.shape,p.colors[0],{alt:p.name})+'</div>'+
            '<div class="panel-body"><div class="sku-cust">'+p.sku+'</div>'+
              '<b style="font-size:.875rem;display:block;margin-top:4px">'+p.name+'</b>'+
              '<div class="sku-parent" style="margin-top:6px">mill ref '+p.parentSku+'</div>'+
              '<a class="btn btn-outline btn-sm btn-block" style="margin-top:14px" href="../product/?sku='+p.sku+'">Edit the item</a></div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Spread</h3></div><div class="panel-body" id="spread"></div></div>'+
        '</div>'+
      '</div>';

    function paintMatrix(){
      var qty = parseInt(document.getElementById('qtySel').value,10);
      var rows = A.COMPANIES.filter(function(c){ return c.status!=='Pending approval'; })
        .map(function(c){ return { c:c, price:A.priceFor(c,p,qty) }; })
        .sort(function(a,b){ return a.price-b.price; });

      document.getElementById('matTbl').innerHTML =
        '<thead><tr><th>Account</th><th>Tier</th><th class="num">Tier price</th><th class="num">Override</th>'+
        '<th class="num">They pay</th><th class="num">vs list</th><th class="num">Margin</th><th></th></tr></thead><tbody>'+
        rows.map(function(r){
          var listP = p.base*D.BREAK_FACTOR[D.breakIndex(qty)];
          var tierP = listP*D.TIERS[r.c.tier].factor;
          var ov = r.c.overrides[p.sku];
          var m = r.price ? (r.price-cost)/r.price*100 : 0;
          var off = (1 - r.price/listP)*100;
          return '<tr><td class="nw"><a class="lk" href="../customer/?id='+r.c.id+'">'+r.c.name+'</a>'+
              '<div class="small muted mono">'+r.c.id+'</div></td>'+
            '<td class="nw"><span class="badge '+(r.c.tier==='A'?'badge-new':r.c.tier==='B'?'badge-eco':'')+'">Tier '+r.c.tier+'</span></td>'+
            '<td class="num muted">'+TBM.usd(tierP)+'</td>'+
            '<td class="num">'+(ov?'<span class="badge badge-warn">'+((1-ov)*100).toFixed(0)+'%</span>':'<span class="muted">—</span>')+'</td>'+
            '<td class="num"><b style="font-size:.9375rem">'+TBM.usd(r.price)+'</b></td>'+
            '<td class="num '+(off>0.5?'diff-up':'diff-same')+'">'+(off>0.5?'\u2212'+off.toFixed(0)+'%':'list')+'</td>'+
            '<td class="num" style="color:'+(m<28?'var(--warn)':'var(--ok)')+'">'+m.toFixed(0)+'%</td>'+
            '<td class="num"><a class="btn btn-outline btn-sm" href="../customer/?id='+r.c.id+'">Rate card</a></td></tr>';
        }).join('')+'</tbody>'+
        '<caption style="caption-side:bottom;text-align:left;padding:12px 14px;font-size:.75rem;color:var(--muted)">'+
          'Standard list at '+TBM.num(qty)+' is '+TBM.usd(p.base*D.BREAK_FACTOR[D.breakIndex(qty)])+
          '. Not one of these numbers is published anywhere — each account sees only its own row.</caption>';

      var lo = rows[0], hi = rows[rows.length-1];
      document.getElementById('spread').innerHTML =
        '<div class="summary-row" style="padding:6px 0"><span class="muted">Lowest</span><span class="v">'+TBM.usd(lo.price)+'</span></div>'+
        '<div class="summary-row" style="padding:6px 0"><span class="muted">Highest</span><span class="v">'+TBM.usd(hi.price)+'</span></div>'+
        '<div class="summary-row" style="padding:6px 0"><span class="muted">Spread</span><span class="v">'+((hi.price-lo.price)/hi.price*100).toFixed(0)+'%</span></div>'+
        '<div class="summary-row" style="padding:6px 0"><span class="muted">Accounts</span><span class="v">'+rows.length+'</span></div>'+
        '<div style="margin-top:14px">'+U.barList(rows.slice(0,6).map(function(r){
          return { label:r.c.name, value:r.price, display:TBM.usd(r.price), sub:'Tier '+r.c.tier };
        }), { narrow:true })+'</div>';
    }

    document.getElementById('skuSel').addEventListener('change', function(){ sku=this.value; shell(); });
    document.getElementById('qtySel').addEventListener('change', paintMatrix);
    document.getElementById('expM').addEventListener('click', function(){
      var qty = parseInt(document.getElementById('qtySel').value,10);
      U.download(p.sku+'-account-prices.csv', U.csv(
        [['Account','Account ID','Tier','Override','Price at '+qty,'Margin %']].concat(
          A.COMPANIES.filter(function(c){return c.status!=='Pending approval';}).map(function(c){
            var pr = A.priceFor(c,p,qty);
            return [c.name,c.id,c.tier,c.overrides[p.sku]||'',pr.toFixed(2),(((pr-cost)/pr)*100).toFixed(1)];
          }))
      ));
      TBM.toast('Account prices exported');
    });
    paintMatrix();
  }

  /* ---------- Tiers & breaks ---------- */
  function tabTiers(){
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-split">'+
        '<div>'+
          '<div class="panel" style="margin-bottom:20px">'+
            '<div class="panel-head"><h3>Contract tiers</h3><button class="btn btn-outline btn-sm" id="addTier">Add a tier</button></div>'+
            '<div class="table-wrap"><table class="table adm-table" id="tierTbl"></table></div>'+
          '</div>'+
          '<div class="panel">'+
            '<div class="panel-head"><h3>Quantity breaks</h3><span class="small muted">Applied on top of the tier, for every account</span></div>'+
            '<div class="table-wrap"><table class="table adm-table" id="brkTbl"></table></div>'+
          '</div>'+
        '</div>'+
        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>How a price is built</h3></div><div class="panel-body">'+
            '<div style="display:grid;gap:10px;font-size:.875rem">'+
              '<div style="background:var(--sand);border:1px solid var(--line);border-radius:9px;padding:11px 13px"><b>1. Base price</b><div class="small muted">Set on the item. Tier C at the smallest break.</div></div>'+
              '<div style="text-align:center;color:var(--muted-2)">×</div>'+
              '<div style="background:var(--sand);border:1px solid var(--line);border-radius:9px;padding:11px 13px"><b>2. Quantity break</b><div class="small muted">From the table on the left.</div></div>'+
              '<div style="text-align:center;color:var(--muted-2)">×</div>'+
              '<div style="background:var(--sand);border:1px solid var(--line);border-radius:9px;padding:11px 13px"><b>3. Account tier</b><div class="small muted">A, B or C, set per company.</div></div>'+
              '<div style="text-align:center;color:var(--muted-2)">×</div>'+
              '<div style="background:var(--kraft-100);border:1px solid var(--kraft);border-radius:9px;padding:11px 13px"><b>4. Item override</b><div class="small muted">Optional, negotiated per account per item.</div></div>'+
              '<div style="text-align:center;color:var(--muted-2)">=</div>'+
              '<div style="background:var(--forest);color:#fff;border-radius:9px;padding:11px 13px"><b>What that customer sees</b><div class="small" style="color:#B9CDBF">Never shown until they are signed in.</div></div>'+
            '</div>'+
          '</div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Accounts per tier</h3></div><div class="panel-body" id="tierSplit"></div></div>'+
        '</div>'+
      '</div>';

    function paintTiers(){
      var counts = {A:0,B:0,C:0};
      A.COMPANIES.forEach(function(c){ counts[c.tier]=(counts[c.tier]||0)+1; });
      document.getElementById('tierTbl').innerHTML =
        '<thead><tr><th>Tier</th><th>Name</th><th class="num">Discount off list</th><th class="num">Accounts</th><th class="num">Revenue 12m</th><th>Default</th></tr></thead><tbody>'+
        ['A','B','C'].map(function(t){
          var rev = A.byCompany().filter(function(x){ var c=A.company(x.key); return c && c.tier===t; })
            .reduce(function(s,x){ return s+x.spend; },0);
          return '<tr><td><b>Tier '+t+'</b></td>'+
            '<td>'+D.TIERS[t].name.split('—')[1].trim()+'</td>'+
            '<td class="num"><input class="cell-edit" data-tier="'+t+'" value="'+((1-D.TIERS[t].factor)*100).toFixed(0)+'%"></td>'+
            '<td class="num">'+(counts[t]||0)+'</td>'+
            '<td class="num"><b>'+TBM.usd(rev)+'</b></td>'+
            '<td><label class="sw"><input type="radio" name="deft" '+(t==='C'?'checked':'')+'><span class="track"></span></label></td></tr>';
        }).join('')+'</tbody>';

      document.querySelectorAll('[data-tier]').forEach(function(inp){
        inp.addEventListener('change', function(){
          var pct = parseFloat(this.value.replace('%',''));
          if (isNaN(pct)||pct<0||pct>60){ TBM.toast('Enter 0–60%.'); paintTiers(); return; }
          D.TIERS[this.dataset.tier].factor = Math.round((1-pct/100)*1000)/1000;
          TBM.toast('Tier '+this.dataset.tier+' repriced — '+(counts[this.dataset.tier]||0)+' accounts affected');
          paintTiers();
        });
      });

      document.getElementById('tierSplit').innerHTML = U.barList(['A','B','C'].map(function(t){
        return { label:D.TIERS[t].name, value:counts[t]||0, display:(counts[t]||0)+' accounts',
          sub:((1-D.TIERS[t].factor)*100).toFixed(0)+'% off list' };
      }), { narrow:true });
    }

    document.getElementById('brkTbl').innerHTML =
      '<thead><tr><th>From quantity</th><th class="num">Factor</th><th class="num">Discount</th><th class="num">Example, DS4520 Tier C</th></tr></thead><tbody>'+
      D.BREAKS.map(function(b,i){
        var ex = (D.byId('ds4520')||D.PRODUCTS[0]).base * D.BREAK_FACTOR[i];
        return '<tr><td><b>'+TBM.num(b)+'+</b></td>'+
          '<td class="num"><input class="cell-edit" value="'+D.BREAK_FACTOR[i].toFixed(2)+'"></td>'+
          '<td class="num muted">'+((1-D.BREAK_FACTOR[i])*100).toFixed(0)+'%</td>'+
          '<td class="num">'+TBM.usd(ex)+'</td></tr>';
      }).join('')+'</tbody>';

    document.getElementById('addTier').addEventListener('click', function(){
      TBM.toast('A fourth tier can be added at any time and assigned per account');
    });
    paintTiers();
  }

  /* ---------- All overrides ---------- */
  function tabOverrides(){
    var rows = [];
    A.COMPANIES.forEach(function(c){
      Object.keys(c.overrides).forEach(function(s){
        var p = D.byId(s); if (!p) return;
        var price = A.priceFor(c,p,D.BREAKS[2]);
        var cost = p.base*0.52;
        rows.push({ c:c, p:p, ov:c.overrides[s], price:price, margin:(price-cost)/price*100 });
      });
    });
    rows.sort(function(a,b){ return a.margin-b.margin; });

    document.getElementById('tabBody').innerHTML =
      '<div class="mini-kpi" style="margin-bottom:18px">'+
        '<div class="stat"><div class="lab">Active overrides</div><div class="val">'+rows.length+'</div>'+
          '<div class="sub">across '+A.COMPANIES.filter(function(c){return Object.keys(c.overrides).length;}).length+' accounts</div></div>'+
        '<div class="stat"><div class="lab">Deepest</div><div class="val">'+
          (rows.length?Math.max.apply(null,rows.map(function(r){return (1-r.ov)*100;})).toFixed(0)+'%':'—')+'</div>'+
          '<div class="sub">off the account’s tier price</div></div>'+
        '<div class="stat"><div class="lab">Below the margin floor</div><div class="val" style="color:var(--warn)">'+
          rows.filter(function(r){ return r.margin<28; }).length+'</div><div class="sub">need owner sign-off</div></div>'+
        '<div class="stat"><div class="lab">Items affected</div><div class="val">'+
          (function(){ var s={}; rows.forEach(function(r){ s[r.p.sku]=1; }); return Object.keys(s).length; })()+'</div>'+
          '<div class="sub">of '+D.PRODUCTS.length+' in the catalog</div></div>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-head"><h3>Every negotiated line in the system</h3>'+
          '<button class="btn btn-outline btn-sm" id="expO">Export</button></div>'+
        '<div class="table-wrap"><table class="table adm-table" id="ovTbl"></table></div>'+
      '</div>';

    document.getElementById('ovTbl').innerHTML =
      '<thead><tr><th>Account</th><th>Tier</th><th>Item</th><th>Description</th>'+
      '<th class="num">Override</th><th class="num">Price at '+TBM.num(D.BREAKS[2])+'</th><th class="num">Margin</th><th></th></tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr'+(r.margin<28?' style="background:#FFFBF4"':'')+'>'+
          '<td class="nw"><a class="lk" href="../customer/?id='+r.c.id+'">'+r.c.name+'</a></td>'+
          '<td class="nw"><span class="badge">Tier '+r.c.tier+'</span></td>'+
          '<td class="nw"><a class="lk mono" href="../product/?sku='+r.p.sku+'">'+r.p.sku+'</a></td>'+
          '<td><span class="trunc" style="max-width:220px">'+r.p.name+'</span></td>'+
          '<td class="num"><span class="badge badge-warn">'+((1-r.ov)*100).toFixed(0)+'%</span></td>'+
          '<td class="num"><b>'+TBM.usd(r.price)+'</b></td>'+
          '<td class="num" style="color:'+(r.margin<28?'var(--warn)':'var(--ok)')+'">'+r.margin.toFixed(0)+'%'+
            (r.margin<28?' '+I.shield:'')+'</td>'+
          '<td class="num"><button class="btn btn-ghost btn-sm" style="color:var(--bad)" data-del="'+r.c.id+'|'+r.p.sku+'">Remove</button></td></tr>';
      }).join('')+'</tbody>';

    document.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.dataset.del.split('|');
        var c = A.company(parts[0]);
        delete c.overrides[parts[1]];
        TBM.toast(parts[1]+' override removed — '+c.name+' falls back to '+D.TIERS[c.tier].name);
        tabOverrides();
      });
    });
    document.getElementById('expO').addEventListener('click', function(){
      U.download('tbm-overrides.csv', U.csv(
        [['Account','Account ID','Tier','Item','Description','Override multiplier','Discount %','Price','Margin %']].concat(
          rows.map(function(r){
            return [r.c.name,r.c.id,r.c.tier,r.p.sku,r.p.name,r.ov,((1-r.ov)*100).toFixed(0),r.price.toFixed(2),r.margin.toFixed(1)];
          }))
      ));
      TBM.toast('Overrides exported');
    });
  }

  /* ---------- Policy ---------- */
  function tabPolicy(){
    document.getElementById('tabBody').innerHTML =
      '<div class="adm-split">'+
        '<div class="panel"><div class="panel-head"><h3>Margin policy</h3></div><div class="panel-body">'+
          '<div class="field-row">'+
            '<div class="field"><label class="label">Gross margin floor</label><input class="input" value="28%"></div>'+
            '<div class="field"><label class="label">Warn below</label><input class="input" value="32%"></div>'+
          '</div>'+
          '<div class="field-row" style="margin-top:16px">'+
            '<div class="field"><label class="label">Maximum tier discount</label><input class="input" value="20%"></div>'+
            '<div class="field"><label class="label">Maximum item override</label><input class="input" value="15%"></div>'+
          '</div>'+
          '<hr style="margin:22px 0">'+
          '<div style="display:grid;gap:12px">'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Block saving a price below the floor without owner sign-off</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Flag orders that fall below the floor at confirmation</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Recalculate all accounts when a base price changes</label>'+
            '<label class="sw"><input type="checkbox"><span class="track"></span>Let reps set overrides without approval</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Hold an account’s pricing when its resale certificate expires</label>'+
          '</div>'+
          '<div class="note-box" style="margin-top:20px">'+I.lock+
            '<span>Rate cards never leave this system automatically. Exports are logged against your name and the customer-facing site only ever renders the signed-in account’s own numbers.</span></div>'+
        '</div></div>'+
        '<div style="display:grid;gap:18px">'+
          '<div class="panel"><div class="panel-head"><h3>Below the floor right now</h3></div><div class="panel-body" id="lowM"></div></div>'+
          '<div class="panel"><div class="panel-head"><h3>Price change log</h3></div><div class="panel-body" style="display:grid;gap:12px">'+
            [['13 Sep','Beacon Events — DS4580 override to −14%','Maya Castellanos'],
             ['1 Sep','Tier A discount 13% → 14%','Maya Castellanos'],
             ['24 Aug','DS4545 base price 7.20 → 7.40','Renu Kapoor'],
             ['14 Aug','Northline — DS4520 override added','Jordan Alvarez'],
             ['1 Jan','Annual rate card reset','Maya Castellanos']].map(function(h){
              return '<div style="display:flex;gap:11px;align-items:flex-start">'+
                '<span style="width:7px;height:7px;border-radius:50%;background:var(--kraft);flex:none;margin-top:6px"></span>'+
                '<span><b style="font-size:.8125rem;display:block">'+h[1]+'</b>'+
                '<span class="small muted">'+h[0]+' · '+h[2]+'</span></span></div>';
            }).join('')+
          '</div></div>'+
        '</div>'+
      '</div>';

    var low = [];
    A.COMPANIES.forEach(function(c){
      D.PRODUCTS.forEach(function(p){
        var pr = A.priceFor(c,p,D.BREAKS[2]);
        var m = (pr - p.base*0.52)/pr*100;
        if (m < 28) low.push({ c:c, p:p, m:m, pr:pr });
      });
    });
    low.sort(function(a,b){ return a.m-b.m; });
    document.getElementById('lowM').innerHTML = low.length
      ? U.barList(low.slice(0,8).map(function(r){
          return { label:r.c.name, mono:r.p.sku, value:40-r.m, display:r.m.toFixed(0)+'%', sub:TBM.usd(r.pr) };
        }), { narrow:true }) + '<div class="hint" style="margin-top:12px">'+low.length+' account/item combinations sit under the 28% floor.</div>'
      : '<p class="small muted" style="margin:0">Nothing is under the floor.</p>';
  }

  shell();
