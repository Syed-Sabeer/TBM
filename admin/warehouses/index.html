<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Warehouses — TBM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230E2318'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="../../assets/js/bags.js"></script>
<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/admin-data.js"></script>
<script src="../../assets/js/admin.js"></script>
</head>
<body class="adm-body-root">
<div id="adm-root"></div>

<script>
(function(){
  var U = TBMAdminUI;
  if (!U.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAdmin;

  var mount = U.renderShell('warehouses', 'Warehouses', 'Stocking locations and allocation rules');

  var META = {
    LAX: { addr:'1420 E 15th St, Los Angeles, CA 90021', size:'182,000 sq ft', type:'Owned', opened:'2015', decoration:true },
    EWR: { addr:'85 Raritan Center Pkwy, Edison, NJ 08837', size:'96,000 sq ft', type:'Owned', opened:'2018', decoration:false },
    DFW: { addr:'2915 Realty Rd, Suite 40, Dallas, TX 75212', size:'54,000 sq ft', type:'3PL', opened:'2025', decoration:false }
  };

  function render(){
    var byWh = {};
    A.byWarehouse().forEach(function(w){ byWh[w.key]=w; });

    mount.innerHTML =
      '<div class="adm-head">'+
        '<div><h2>Warehouses</h2><p>Every stocking location the catalog can draw from. Add one and it appears on the item page, in the checkout picker and in the import mapping straight away — including a customer’s own consignment site.</p></div>'+
        '<button class="btn btn-primary" id="add">Create a warehouse</button>'+
      '</div>'+

      '<div class="mini-kpi" style="margin-bottom:20px">'+
        '<div class="stat"><div class="lab">Locations</div><div class="val">'+D.WAREHOUSES.length+'</div><div class="sub">2 owned, 1 third-party</div></div>'+
        '<div class="stat"><div class="lab">Units held</div><div class="val">'+U.compact(D.PRODUCTS.reduce(function(s,p){ return s+D.totalStock(p); },0))+'</div><div class="sub">all sites</div></div>'+
        '<div class="stat"><div class="lab">Square feet</div><div class="val">332K</div><div class="sub">combined</div></div>'+
        '<div class="stat"><div class="lab">Items held everywhere</div><div class="val">'+
          D.PRODUCTS.filter(function(p){ return D.WAREHOUSES.every(function(w){ return (p.stock[w.code]||0)>0; }); }).length+
          '</div><div class="sub">of '+D.PRODUCTS.length+'</div></div>'+
      '</div>'+

      '<div id="newPanel" class="hide"></div>'+

      '<div class="grid g-3" style="align-items:start;margin-bottom:22px" id="cards"></div>'+

      '<div class="panel">'+
        '<div class="panel-head"><h3>Allocation rules</h3><span class="small muted">Applied when a customer has not picked a site</span></div>'+
        '<div class="panel-body">'+
          '<div class="radio-stack" style="margin-bottom:18px">'+
            '<label class="radio-card"><input type="radio" name="alloc" checked><span><b>Closest to the ship-to address</b>'+
              '<span class="small muted" style="display:block">Lowest freight. The default for parcel-sized orders.</span></span></label>'+
            '<label class="radio-card"><input type="radio" name="alloc"><span><b>Deepest stock first</b>'+
              '<span class="small muted" style="display:block">Keeps the smaller sites from being cleaned out by one large order.</span></span></label>'+
            '<label class="radio-card"><input type="radio" name="alloc"><span><b>Single site, never split</b>'+
              '<span class="small muted" style="display:block">One shipment even if it costs more freight. Some accounts insist on it.</span></span></label>'+
          '</div>'+
          '<div style="display:grid;gap:12px">'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Allow a single order to draw from more than one warehouse</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Publish a combined quantity on the storefront rather than per site</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Hold back 2% of each item as safety stock</label>'+
            '<label class="sw"><input type="checkbox"><span class="track"></span>Let customers see the quantity at each individual site</label>'+
          '</div>'+
        '</div>'+
      '</div>'+

      '<div class="panel" style="margin-top:20px">'+
        '<div class="panel-head"><h3>Stock spread by site</h3></div>'+
        '<div class="table-wrap"><table class="table adm-table" id="spreadTbl"></table></div>'+
      '</div>';

    document.getElementById('cards').innerHTML = D.WAREHOUSES.map(function(w){
      var m = META[w.code] || { addr:'—', size:'—', type:'3PL', opened:'2026', decoration:false };
      var s = byWh[w.code];
      var units = D.PRODUCTS.reduce(function(t,p){ return t+(p.stock[w.code]||0); },0);
      var items = D.PRODUCTS.filter(function(p){ return (p.stock[w.code]||0)>0; }).length;
      return '<div class="loc">'+
        '<div class="loc-map"><span class="pin">'+I.pin+'</span></div>'+
        '<div class="loc-body">'+
          '<div class="row-between" style="align-items:flex-start"><div>'+
            '<h4>'+w.name+'</h4><span class="rg">'+w.region+' · code '+w.code+'</span></div>'+
            '<span class="badge '+(m.type==='Owned'?'badge-eco':'')+'">'+m.type+'</span></div>'+
          '<address style="margin-top:10px">'+m.addr+'</address>'+
          '<div class="hrs" style="margin-top:14px">'+
            '<div><span>Units held</span><b>'+TBM.num(units)+'</b></div>'+
            '<div><span>Items held</span><b>'+items+' of '+D.PRODUCTS.length+'</b></div>'+
            '<div><span>Orders shipped 12m</span><b>'+(s?s.orderCount:0)+'</b></div>'+
            '<div><span>Floor space</span><b>'+m.size+'</b></div>'+
            '<div><span>Transit</span><b>'+w.lead+'</b></div>'+
            '<div><span>Decoration on site</span><b>'+(m.decoration?'Yes':'No')+'</b></div>'+
          '</div>'+
          '<div class="row" style="gap:8px;margin-top:16px">'+
            '<a class="btn btn-outline btn-sm" href="../inventory/?wh='+w.code+'">Stock</a>'+
            '<button class="btn btn-ghost btn-sm" data-edit="'+w.code+'">Edit</button>'+
            '<label class="sw" style="margin-left:auto"><input type="checkbox" checked><span class="track"></span></label>'+
          '</div>'+
        '</div></div>';
    }).join('');

    document.getElementById('spreadTbl').innerHTML =
      '<thead><tr><th>Item</th><th>Description</th>'+
      D.WAREHOUSES.map(function(w){ return '<th class="num">'+w.code+'</th>'; }).join('')+
      '<th class="num">Total</th><th>Spread</th></tr></thead><tbody>'+
      D.PRODUCTS.slice(0,12).map(function(p){
        var tot = D.totalStock(p) || 1;
        return '<tr><td class="nw"><a class="lk mono" href="../product/?sku='+p.sku+'">'+p.sku+'</a></td>'+
          '<td><span class="trunc" style="max-width:220px">'+p.name+'</span></td>'+
          D.WAREHOUSES.map(function(w){
            var q=p.stock[w.code]||0;
            return '<td class="num'+(q?'':' muted')+'">'+TBM.num(q)+'</td>';
          }).join('')+
          '<td class="num"><b>'+TBM.num(D.totalStock(p))+'</b></td>'+
          '<td style="min-width:130px"><span style="display:flex;height:8px;border-radius:3px;overflow:hidden;gap:2px">'+
            D.WAREHOUSES.map(function(w,i){
              var pct = (p.stock[w.code]||0)/tot*100;
              var col = ['var(--forest)','#2B5FA8','var(--kraft)'][i];
              return '<i style="display:block;width:'+pct.toFixed(1)+'%;background:'+col+'"></i>';
            }).join('')+'</span></td></tr>';
      }).join('')+'</tbody>'+
      '<caption style="caption-side:bottom;text-align:left;padding:12px 14px;font-size:.75rem;color:var(--muted)">'+
        '<span class="legend" style="margin:0">'+D.WAREHOUSES.map(function(w,i){
          return '<span><i style="background:'+['var(--forest)','#2B5FA8','var(--kraft)'][i]+'"></i>'+w.name+'</span>';
        }).join('')+'</span></caption>';

    document.getElementById('add').addEventListener('click', showNew);
    document.querySelectorAll('[data-edit]').forEach(function(b){
      b.addEventListener('click', function(){ TBM.toast('Editing '+b.dataset.edit+' — address, hours, transit times and codes'); });
    });
  }

  function showNew(){
    var el = document.getElementById('newPanel');
    el.classList.remove('hide');
    el.innerHTML =
      '<div class="panel" style="margin-bottom:22px;border-color:var(--forest)">'+
        '<div class="panel-head"><h3>Create a warehouse</h3><button class="icon-btn" id="closeNew">'+I.x+'</button></div>'+
        '<div class="panel-body">'+
          '<div class="field-row">'+
            '<div class="field"><label class="label" for="wName">Name</label><input class="input" id="wName" placeholder="Columbus, OH"></div>'+
            '<div class="field"><label class="label" for="wCode">Code</label><input class="input mono" id="wCode" placeholder="CMH" maxlength="4"></div>'+
          '</div>'+
          '<div class="field-row" style="margin-top:16px">'+
            '<div class="field"><label class="label" for="wRegion">Region</label>'+
              '<select class="select" id="wRegion"><option>West Coast</option><option>East Coast</option><option>Central</option><option>Midwest</option><option>South</option></select></div>'+
            '<div class="field"><label class="label" for="wLead">Typical transit</label><input class="input" id="wLead" placeholder="1–2 business days"></div>'+
          '</div>'+
          '<div class="field" style="margin-top:16px"><label class="label" for="wAddr">Address</label><input class="input" id="wAddr" placeholder="Street, city, state, ZIP"></div>'+
          '<div class="field-row" style="margin-top:16px">'+
            '<div class="field"><label class="label" for="wType">Type</label>'+
              '<select class="select" id="wType"><option>Owned</option><option>3PL</option><option>Customer consignment</option></select></div>'+
            '<div class="field"><label class="label" for="wCo">Held for (consignment only)</label>'+
              '<select class="select" id="wCo"><option value="">— shared stock —</option>'+
              A.COMPANIES.filter(function(c){return c.status==='Active';}).map(function(c){ return '<option>'+c.name+'</option>'; }).join('')+
              '</select></div>'+
          '</div>'+
          '<div style="margin-top:18px;display:grid;gap:10px">'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Include in the combined quantity shown on the storefront</label>'+
            '<label class="sw"><input type="checkbox" checked><span class="track"></span>Available as a ship-from option at checkout</label>'+
            '<label class="sw"><input type="checkbox"><span class="track"></span>Decoration available on site</label>'+
          '</div>'+
          '<div class="note-box" style="margin-top:18px">'+I.box+
            '<span>A consignment site holds stock in one customer’s name. Only that account sees it, and it reports beside your own warehouses.</span></div>'+
          '<button class="btn btn-primary btn-lg" style="margin-top:20px" id="createW">Create the warehouse</button>'+
        '</div>'+
      '</div>';

    document.getElementById('closeNew').addEventListener('click', function(){ el.classList.add('hide'); });
    document.getElementById('createW').addEventListener('click', function(){
      var name = document.getElementById('wName').value.trim();
      var code = document.getElementById('wCode').value.trim().toUpperCase();
      if (!name || !code){ TBM.toast('A name and a three-letter code are required.'); return; }
      if (D.WAREHOUSES.some(function(w){ return w.code===code; })){ TBM.toast('That code is already in use.'); return; }
      D.WAREHOUSES.push({
        code: code, name: name,
        region: document.getElementById('wRegion').value,
        lead: document.getElementById('wLead').value.trim() || '2–3 business days'
      });
      META[code] = { addr: document.getElementById('wAddr').value.trim() || '—', size:'—',
        type: document.getElementById('wType').value, opened:'2026', decoration:false };
      D.PRODUCTS.forEach(function(p){ p.stock[code] = 0; });
      TBM.toast(name+' created — it is now a ship-from option and appears in the import mapping');
      el.classList.add('hide');
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
