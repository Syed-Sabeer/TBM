<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item — TBM Wholesale Bags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%231C3D2E'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="assets/js/bags.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</head>
<body>

<div id="site-header"></div>
<script>TBM.renderHeader('bags')</script>

<div class="page-head" style="padding-block:20px">
  <div class="container"><nav class="crumbs" id="crumbs"></nav></div>
</div>

<div class="container">
  <div class="pdp">
    <!-- ============ GALLERY ============ -->
    <div class="gallery">
      <div class="gallery-main">
        <div class="gallery-flags" id="galFlags"></div>
        <div id="galMain"></div>
        <button class="gallery-zoom" aria-label="Zoom" data-ico="zoom"></button>
      </div>
      <div class="gallery-thumbs" id="galThumbs"></div>
      <div class="panel" style="margin-top:18px;padding:16px 18px">
        <div class="row" style="gap:12px;align-items:flex-start">
          <span style="color:var(--kraft);flex:none" data-ico="palette"></span>
          <div>
            <b style="font-size:.8125rem">Colour shown is indicative</b>
            <div class="small muted">Ask your rep for a physical colour card before committing a Pantone match. Free to approved accounts.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ INFO ============ -->
    <div class="pdp-info">
      <div class="row" style="gap:7px;margin-bottom:14px" id="infoFlags"></div>
      <h1 id="pName"></h1>
      <div class="pdp-skus" id="pSkus"></div>
      <p class="lede" id="pDesc" style="font-size:.9375rem"></p>

      <div class="pdp-block">
        <div class="pdp-label">Colour <b id="colName"></b></div>
        <div class="swatches" id="colOpts"></div>
      </div>

      <div class="pdp-block">
        <div class="pdp-label">Size</div>
        <div class="size-opts" id="sizeOpts"></div>
      </div>

      <div class="pdp-block">
        <div class="pdp-label">Decoration</div>
        <div class="size-opts" id="decOpts"></div>
        <div class="hint" id="decHint"></div>
      </div>

      <div class="pdp-block">
        <div class="pdp-label">Quantity <b id="breakHint"></b></div>
        <div class="row" style="gap:14px;flex-wrap:wrap">
          <div id="qtyMount"></div>
          <div class="small muted" id="cartonNote"></div>
        </div>
      </div>

      <div class="pdp-block" id="priceBlock"></div>

      <div class="pdp-block">
        <div class="buy-row">
          <button class="btn btn-primary btn-lg" id="addBtn" style="flex:1;min-width:200px"></button>
          <a class="btn btn-outline btn-lg" href="register.html">Request a sample</a>
        </div>
        <div class="stock-line" id="stockLine"></div>
      </div>

      <div class="pdp-block">
        <div class="pdp-label">Stock by warehouse</div>
        <div class="panel">
          <table class="table table-compact wh-table" id="whTable"></table>
        </div>
      </div>

      <div class="pdp-block">
        <div class="assure" id="assure"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ TABS ============ -->
<div class="tabs">
  <div class="container">
    <div class="tabnav" id="tabnav">
      <button class="is-active" data-t="desc">Description</button>
      <button data-t="spec">Specifications</button>
      <button data-t="imp">Imprint &amp; decoration</button>
      <button data-t="ship">Packaging &amp; shipping</button>
      <button data-t="dl">Downloads</button>
    </div>

    <div class="tabpanel is-active" id="t-desc"><div class="prose" id="descBody"></div></div>
    <div class="tabpanel" id="t-spec"><div class="spec-grid" id="specBody"></div></div>
    <div class="tabpanel" id="t-imp"><div class="prose" id="impBody"></div></div>
    <div class="tabpanel" id="t-ship"><div class="prose" id="shipBody"></div></div>
    <div class="tabpanel" id="t-dl"><ul class="dl-list" id="dlBody" style="max-width:560px"></ul></div>
  </div>
</div>

<!-- ============ RELATED ============ -->
<section class="section section-tint">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Often ordered together</span>
        <h2 class="h2" style="margin-top:14px">From the same family</h2>
      </div>
      <a class="link-arrow" id="relLink" href="shop.html">See the category <span data-ico="arrow"></span></a>
    </div>
    <div class="prod-grid" id="relGrid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script>TBM.renderFooter()</script>

<script>
(function(){
  var I = TBM.I, D = TBMData, B = TBMBags;
  document.querySelectorAll('[data-ico]').forEach(function(el){ el.innerHTML = I[el.dataset.ico] || ''; });

  var p = D.byId(TBM.qp('sku') || '') || D.PRODUCTS[0];
  var cat = D.catBySlug(p.cat);

  var sel = {
    color: p.colors[0],
    size:  p.sizes[0],
    dec:   'Blank (undecorated)',
    qty:   p.moq
  };

  document.title = p.sku + ' — ' + p.name + ' | TBM';

  /* ---- Crumbs ---- */
  document.getElementById('crumbs').innerHTML =
    '<a href="index.html">Home</a>'+I.chev+
    '<a href="shop.html">Catalog</a>'+I.chev+
    '<a href="shop.html?cat='+p.cat+'">'+cat.name+'</a>'+I.chev+
    '<span class="current">'+p.sku+'</span>';

  /* ---- Head info ---- */
  document.getElementById('pName').textContent = p.name;
  document.getElementById('pDesc').textContent = p.desc;
  document.getElementById('infoFlags').innerHTML = TBM.flagHTML(p);
  document.getElementById('galFlags').innerHTML = TBM.flagHTML(p);
  document.getElementById('pSkus').innerHTML =
    '<span class="sku-badge">Item '+p.sku+'</span>'+
    '<span class="row" style="gap:4px;color:var(--kraft)">'+
      Array(5).join('0').split('').map(function(){return '';}).join('')+
      '<span style="display:flex;gap:2px">'+[0,1,2,3,4].map(function(i){
        return '<span style="width:14px;height:14px;color:'+(i < Math.round(p.rating) ? 'var(--kraft)' : 'var(--line-2)')+'">'+I.star+'</span>';
      }).join('')+'</span>'+
      '<span class="small muted" style="margin-left:6px">'+p.rating+' ('+p.reviews+' reviews)</span>'+
    '</span>';

  /* ---- Gallery ---- */
  var VIEWS = ['front','back','detail','flat','packed'];
  var view = 0;
  function paintGallery(){
    document.getElementById('galMain').innerHTML = B.figure(p.shape, sel.color, { alt: p.name + ' — ' + B.color(sel.color).name });
    document.getElementById('galThumbs').innerHTML = p.colors.slice(0,5).map(function(k,i){
      return '<button class="gthumb '+(k===sel.color?'is-active':'')+'" data-c="'+k+'" title="'+B.color(k).name+'">'+
        B.figure(p.shape,k,{alt:B.color(k).name})+'</button>';
    }).join('');
  }
  document.getElementById('galThumbs').addEventListener('click', function(e){
    var b = e.target.closest('.gthumb'); if (!b) return;
    sel.color = b.dataset.c; paintAll();
  });

  /* ---- Colour ---- */
  function paintColors(){
    document.getElementById('colName').textContent = B.color(sel.color).name;
    document.getElementById('colOpts').innerHTML = p.colors.map(function(k){
      var c = B.color(k);
      return '<button class="swatch swatch-lg '+(k===sel.color?'is-active':'')+'" data-c="'+k+'" title="'+c.name+'" style="background:'+c.body+'"></button>';
    }).join('');
  }
  document.getElementById('colOpts').addEventListener('click', function(e){
    var b = e.target.closest('[data-c]'); if (!b) return;
    sel.color = b.dataset.c; paintAll();
  });

  /* ---- Size ---- */
  function paintSizes(){
    document.getElementById('sizeOpts').innerHTML = p.sizes.map(function(s){
      return '<button class="size-opt '+(s===sel.size?'is-active':'')+'" data-s="'+s+'">'+s+
        '<small>'+(p.weight!=='—' ? p.weight+' '+p.material : p.material)+'</small></button>';
    }).join('');
  }
  document.getElementById('sizeOpts').addEventListener('click', function(e){
    var b = e.target.closest('[data-s]'); if (!b) return;
    sel.size = b.dataset.s; paintSizes();
  });

  /* ---- Decoration ---- */
  var DECS = [
    ['Blank (undecorated)','Ships from stock'],
    ['Screen print','1–6 spot colours'],
    ['DTF transfer','Full colour, no set-up'],
    ['Embroidery','Up to 15k stitches'],
    ['Sublimation','Poly bodies only']
  ];
  function paintDec(){
    document.getElementById('decOpts').innerHTML = DECS.map(function(dc){
      var off = dc[0]==='Sublimation' && p.material.indexOf('Poly')<0;
      return '<button class="size-opt '+(dc[0]===sel.dec?'is-active':'')+'" data-d="'+dc[0]+'"'+(off?' disabled style="opacity:.4;cursor:not-allowed"':'')+'>'+
        dc[0]+'<small>'+dc[1]+'</small></button>';
    }).join('');
    document.getElementById('decHint').textContent = sel.dec === 'Blank (undecorated)'
      ? 'Blank stock ships in 48 hours. Decoration is quoted separately and added to your order by your rep.'
      : sel.dec + ' is quoted per colour and per location. Add it here and we will attach a decoration quote to this order before it is confirmed.';
  }
  document.getElementById('decOpts').addEventListener('click', function(e){
    var b = e.target.closest('[data-d]'); if (!b || b.disabled) return;
    sel.dec = b.dataset.d; paintDec();
  });

  /* ---- Quantity ---- */
  var step = p.moq >= 500 ? 250 : (p.moq >= 250 ? 50 : 25);
  document.getElementById('qtyMount').innerHTML = TBM.qtyHTML(sel.qty, p.moq, step);
  TBM.wireQty();
  document.getElementById('cartonNote').innerHTML =
    'Minimum <b>'+TBM.num(p.moq)+'</b> · sold in multiples of '+TBM.num(step)+' · '+TBM.num(step*2)+' per master carton';
  document.getElementById('qtyMount').addEventListener('change', function(e){
    sel.qty = Math.max(p.moq, parseInt(e.target.value||p.moq,10));
    e.target.value = sel.qty;
    paintPrice(); paintBreakHint();
  });

  function paintBreakHint(){
    var i = D.breakIndex(sel.qty);
    var next = D.BREAKS[i+1];
    document.getElementById('breakHint').innerHTML = next
      ? '<span class="muted" style="font-weight:450">add '+TBM.num(next-sel.qty)+' more to reach the '+TBM.num(next)+' break</span>'
      : '<span class="muted" style="font-weight:450">best available break</span>';
  }

  /* ---- Price (the gate) ---- */
  function paintPrice(){
    var el = document.getElementById('priceBlock');
    if (!TBM.isIn()){
      el.innerHTML =
        '<div class="price-gate">'+
          '<div class="ico">'+I.lock+'</div>'+
          '<div style="flex:1">'+
            '<h4>Pricing is shown to approved accounts only</h4>'+
            '<p>TBM is wholesale-only and every account carries its own contract rate. Log in to see your price for '+p.sku+', or apply — most accounts are approved within one business day.</p>'+
            '<div class="row"><a class="btn btn-primary btn-sm" href="login.html?next=product.html%3Fsku='+p.sku+'">Log in to see pricing</a>'+
            '<a class="btn btn-outline btn-sm" href="register.html">Open an account</a></div>'+
          '</div>'+
        '</div>'+
        '<div class="tier-table" style="margin-top:16px">'+
          '<table><thead><tr><th>Quantity</th>'+D.BREAKS.map(function(b){return '<th>'+TBM.num(b)+'+</th>';}).join('')+'</tr></thead>'+
          '<tbody><tr><td>Your price / ea</td>'+D.BREAKS.map(function(){return '<td class="muted">&bull;&bull;&bull;&bull;</td>';}).join('')+'</tr></tbody></table>'+
        '</div>';
      return;
    }

    var t = TBM.tier(), row = D.tierRow(p,t), idx = D.breakIndex(sel.qty);
    var unit = row[idx], ext = unit * sel.qty;
    el.innerHTML =
      '<div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px">'+
        '<div>'+
          '<div class="price-now"><b>'+TBM.usd(unit)+'</b><span class="unit">per piece at '+TBM.num(sel.qty)+'</span></div>'+
          '<div class="price-note">Extended <b>'+TBM.usd(ext)+'</b> · blank, FOB warehouse, before freight and decoration.</div>'+
        '</div>'+
        '<span class="your-tier">'+I.tag+D.TIERS[t].name+'</span>'+
      '</div>'+
      '<div class="tier-table" style="margin-top:18px">'+
        '<table><thead><tr><th>Quantity break</th>'+D.BREAKS.map(function(b){return '<th>'+TBM.num(b)+'+</th>';}).join('')+'</tr></thead>'+
        '<tbody><tr><td>Your price / ea</td>'+row.map(function(v,i){
          return '<td class="'+(i===idx?'is-active':'')+'">'+TBM.usd(v)+'</td>';
        }).join('')+'</tr></tbody></table>'+
      '</div>'+
      '<div class="hint">This rate card is specific to your account. Another buyer looking at '+p.sku+' right now may see a different number.</div>';
  }

  /* ---- Stock ---- */
  function paintStock(){
    var total = D.totalStock(p);
    document.getElementById('stockLine').innerHTML =
      TBM.stockBadge(p) + '<span class="muted small">'+TBM.num(total)+' pieces across 3 warehouses · blank stock dispatches in 48 hours</span>';
    document.getElementById('whTable').innerHTML =
      '<thead><tr><th>Warehouse</th><th>Region</th><th class="num">On hand</th><th>Transit</th></tr></thead><tbody>'+
      D.WAREHOUSES.map(function(w){
        var q = p.stock[w.code]||0;
        return '<tr><td>'+w.name+'</td><td class="muted">'+w.region+'</td>'+
          '<td class="num"><b>'+TBM.num(q)+'</b></td>'+
          '<td><span class="badge '+(q>0?'badge-ok':'badge-bad')+'">'+(q>0?w.lead:'Out of stock')+'</span></td></tr>';
      }).join('')+'</tbody>';
  }

  /* ---- Assurances ---- */
  document.getElementById('assure').innerHTML = [
    ['shield','Inspected to AQL 2.5','Every inbound lot, every colour.'],
    ['truck','Split shipments free','Across all three warehouses on one PO.'],
    ['refresh','60-day blank returns','Unopened cartons, no restocking fee.'],
    ['users','Shared company account','Anyone on your team can reorder this item.']
  ].map(function(a){
    return '<div>'+I[a[0]]+'<span><b>'+a[1]+'</b>'+a[2]+'</span></div>';
  }).join('');

  /* ---- Tabs ---- */
  document.getElementById('descBody').innerHTML =
    '<h3>About this item</h3><p>'+p.desc+'</p>'+
    '<p>'+p.name+' is stocked blank in '+p.colors.length+' colours and ships from Los Angeles, Edison and Dallas. It is built for repeat programmes — the body fabric, handle webbing and thread are locked to a fixed specification so a reorder in eighteen months matches the bag you approved today.</p>'+
    '<h3>Where it works</h3><ul>'+
      '<li>Retail carry-out and paid-bag programmes</li>'+
      '<li>Conference, trade show and campus giveaways</li>'+
      '<li>Subscription box and e-commerce packaging inserts</li>'+
      '<li>Corporate gifting and onboarding kits</li>'+
    '</ul>'+
    '<h3>What is not included</h3><p>Prices are for blank goods, FOB warehouse. Decoration, freight, rush handling and custom packing are quoted separately and appear on your order confirmation before anything is charged.</p>';

  document.getElementById('specBody').innerHTML = [
    ['Item number', p.sku],
    ['Category', cat.name],
    ['Body material', p.material],
    ['Fabric weight', p.weight],
    ['Available sizes', p.sizes.join(' · ')],
    ['Stock colours', p.colors.map(function(k){return B.color(k).name;}).join(', ')],
    ['Handle', p.shape==='backpack'||p.shape==='pouch'||p.shape==='laundry'||p.shape==='shoe' ? 'Braided drawstring cord' : (p.shape==='boxy' ? 'Self-fabric, 10" drop' : 'Self-fabric, 22" shoulder drop')],
    ['Closure', p.shape==='zip' ? 'Metal zip with pull tab' : (p.shape==='tote'||p.shape==='boxy'||p.shape==='jute'||p.shape==='wine'||p.shape==='nonwoven' ? 'Open top' : 'Drawstring')],
    ['Stitching', 'Double-needle side and base seams, bar-tacked stress points'],
    ['Minimum order', TBM.num(p.moq) + ' pieces'],
    ['Carton quantity', TBM.num(step*2) + ' pieces'],
    ['Country of origin', 'India / Bangladesh (mill varies by lot)'],
    ['Certifications', p.flags.filter(function(f){return ['gots','grs'].indexOf(f)>-1;}).map(function(f){return f.toUpperCase();}).join(', ') || 'OEKO-TEX Standard 100'],
    ['Compliance', 'CPSIA, Prop 65 compliant']
  ].map(function(r){
    return '<div class="spec-row"><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>';
  }).join('');

  document.getElementById('impBody').innerHTML =
    '<h3>Imprint area</h3><p>Maximum print area on this body is approximately <b>'+
    (p.shape==='pouch' ? '3" × 3"' : p.shape==='zip' ? '6" × 3"' : p.shape==='wine' ? '4" × 7"' : '10" × 10"')+
    '</b> centred on the front panel. Back panel printing is available at the same rate; gusset and base printing is quoted case by case.</p>'+
    '<h3>Methods available on this item</h3><ul>'+
      DECS.filter(function(dc){ return !(dc[0]==='Sublimation' && p.material.indexOf('Poly')<0); })
        .map(function(dc){ return '<li><b>'+dc[0]+'</b> — '+dc[1]+'</li>'; }).join('')+
    '</ul>'+
    '<h3>Artwork</h3><p>Send vector (AI, EPS, PDF) or 300dpi raster. Our studio will clean up or trace at no charge and return a digital proof within 24 hours. Nothing goes to the floor without your written approval.</p>'+
    '<h3>Turnaround</h3><p>5–9 working days from proof approval for screen print and DTF. Add 3 days for embroidery. Rush programmes are available — ask your rep before you quote a date to your customer.</p>';

  document.getElementById('shipBody').innerHTML =
    '<h3>Packing</h3><p>Blank goods are polybagged in bundles of '+TBM.num(step)+' and packed '+TBM.num(step*2)+' to a master carton. Decorated goods are packed to the same carton count unless you specify otherwise.</p>'+
    '<h3>Item numbers on paperwork</h3><p>Your packing slip and invoice carry the item number you see on this page — <b>'+p.sku+'</b>. Internal mill references never appear on documents that reach you or your customer.</p>'+
    '<h3>Shipping</h3><p>FOB our warehouse. We ship on your carrier account or on ours at negotiated rates. A single order can be split across Los Angeles, Edison and Dallas at no extra handling charge — useful when you are serving both coasts from one PO.</p>'+
    '<h3>Lead times</h3><ul><li>Blank stock — dispatched within 48 hours</li><li>Decorated — 5–9 working days after proof approval</li><li>Custom production — 45–60 days FOB port, 70–85 days delivered</li></ul>';

  document.getElementById('dlBody').innerHTML = [
    ['Spec sheet','PDF','218 KB'],
    ['Imprint template','AI','1.4 MB'],
    ['High-res images','ZIP','24 MB'],
    ['GOTS / GRS certificate','PDF','96 KB'],
    ['Prop 65 statement','PDF','44 KB']
  ].map(function(f){
    return '<li><span class="fname"><span class="ftype">'+f[1]+'</span>'+f[0]+'</span>'+
      '<span class="row" style="gap:14px"><span class="small muted">'+f[2]+'</span>'+
      '<a class="btn btn-outline btn-sm" href="#">Download</a></span></li>';
  }).join('');

  document.getElementById('tabnav').addEventListener('click', function(e){
    var b = e.target.closest('button[data-t]'); if (!b) return;
    document.querySelectorAll('#tabnav button').forEach(function(x){ x.classList.toggle('is-active', x===b); });
    document.querySelectorAll('.tabpanel').forEach(function(x){ x.classList.toggle('is-active', x.id==='t-'+b.dataset.t); });
  });

  /* ---- Related ---- */
  var rel = D.byCat(p.cat).filter(function(x){ return x.id!==p.id; });
  if (rel.length < 4){
    rel = rel.concat(D.PRODUCTS.filter(function(x){
      return x.id!==p.id && rel.indexOf(x)<0 && x.flags.indexOf('bestseller')>-1;
    }));
  }
  document.getElementById('relGrid').innerHTML = rel.slice(0,4).map(TBM.productCard).join('');
  document.getElementById('relLink').href = 'shop.html?cat='+p.cat;
  TBM.wireCardSwatches();

  /* ---- Add to order ---- */
  function paintAdd(){
    document.getElementById('addBtn').innerHTML = I.bag + (TBM.isIn() ? 'Add to order' : 'Add to order — price on login');
  }
  document.getElementById('addBtn').addEventListener('click', function(){
    TBM.addToCart({
      id: p.id, sku: p.sku, name: p.name, shape: p.shape,
      color: sel.color, size: sel.size, imprint: sel.dec, qty: sel.qty, moq: p.moq, step: step
    });
    TBM.toast(TBM.num(sel.qty)+' × '+p.sku+' added to your order');
  });

  /* ---- Paint ---- */
  function paintAll(){ paintGallery(); paintColors(); }
  paintAll(); paintSizes(); paintDec(); paintPrice(); paintStock(); paintBreakHint(); paintAdd();
})();
</script>
</body>
</html>
