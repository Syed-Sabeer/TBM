<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order history — TBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%231C3D2E'/><path d='M12 15h16l1 13.5a1.2 1.2 0 0 1-1.2 1.3H12.2a1.2 1.2 0 0 1-1.2-1.3Z' fill='%23F7F4ED'/><path d='M16 15.5c0-4 8-4 8 0' stroke='%23B9793C' stroke-width='2.1' fill='none' stroke-linecap='round'/></svg>">
<script src="assets/js/bags.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/account.js"></script>
</head>
<body>

<div id="site-header"></div>
<script>TBM.renderHeader('account')</script>

<div class="container">
  <div class="dash">
    <aside id="dash-nav"></aside>

    <main>
      <div class="dash-head">
        <div>
          <h1>Order history</h1>
          <p>Every order placed by anyone at <span id="coName"></span> — one shared history, whichever login raised it.</p>
        </div>
        <div class="row" style="gap:10px">
          <button class="btn btn-outline" id="exportBtn">Export CSV</button>
          <a class="btn btn-primary" href="shop.html">Start a new order</a>
        </div>
      </div>

      <div class="stat-grid" id="kpis" style="margin-bottom:22px"></div>

      <div class="filterbar">
        <div class="field" style="flex:1;min-width:220px">
          <label class="label" for="fq">Search</label>
          <input class="input" id="fq" type="search" placeholder="Order number, PO, or item number">
        </div>
        <div class="field"><label class="label" for="fRange">Period</label>
          <select class="select" id="fRange">
            <option value="12">Last 12 months</option>
            <option value="1">Last 30 days</option>
            <option value="3">Last 90 days</option>
            <option value="0">All time</option>
          </select>
        </div>
        <div class="field"><label class="label" for="fStatus">Status</label><select class="select" id="fStatus"></select></div>
        <div class="field"><label class="label" for="fUser">Placed by</label><select class="select" id="fUser"></select></div>
        <div class="field"><label class="label" for="fWh">Warehouse</label><select class="select" id="fWh"></select></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3 id="resultCount"></h3><span class="small muted">Prices reflect your current rate card</span></div>
        <div class="table-wrap"><table class="table table-compact" id="ordersTable"></table></div>
      </div>
      <div id="emptyMount"></div>
      <div class="pagination" id="pager"></div>
    </main>
  </div>
</div>

<div id="site-footer"></div>
<script>TBM.renderFooter()</script>

<script>
(function(){
  if (!TBMAcct.guard()) return;
  var I = TBM.I, D = TBMData, A = TBMAcct;
  document.querySelectorAll('[data-ico]').forEach(function(el){ el.innerHTML = I[el.dataset.ico] || ''; });
  A.renderNav('account-orders.html');
  document.getElementById('coName').textContent = A.COMPANY.name;

  var PER = 12, page = 1;

  /* Filter options */
  var st = document.getElementById('fStatus');
  st.innerHTML = '<option value="">All statuses</option>' +
    ['Pending confirmation','In production','Shipped','Delivered','Cancelled']
      .map(function(s){ return '<option>'+s+'</option>'; }).join('');
  document.getElementById('fUser').innerHTML = '<option value="">Everyone</option>' +
    A.USERS.map(function(u){ return '<option>'+u.name+'</option>'; }).join('');
  document.getElementById('fWh').innerHTML = '<option value="">All warehouses</option>' +
    D.WAREHOUSES.map(function(w){ return '<option value="'+w.code+'">'+w.name+'</option>'; }).join('');

  function cutoff(months){
    if (!months) return null;
    var t = A.TODAY;
    return new Date(t.getFullYear(), t.getMonth()-months, t.getDate());
  }

  function filtered(){
    var q = document.getElementById('fq').value.trim().toLowerCase();
    var s = document.getElementById('fStatus').value;
    var u = document.getElementById('fUser').value;
    var wh = document.getElementById('fWh').value;
    var from = cutoff(parseInt(document.getElementById('fRange').value,10));

    return A.ORDERS.filter(function(o){
      if (from && o.date < from) return false;
      if (s && o.status !== s) return false;
      if (u && o.user !== u) return false;
      if (wh && o.warehouse !== wh) return false;
      if (q){
        var hay = (o.id+' '+o.po+' '+o.user+' '+o.shipTo+' '+o.lines.map(function(l){return l.sku+' '+l.name;}).join(' ')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function paint(){
    var list = filtered();
    var liveList = list.filter(function(o){ return o.status!=='Cancelled'; });
    var pieces = liveList.reduce(function(s,o){ return s+A.orderPieces(o); },0);
    var spend  = liveList.reduce(function(s,o){ return s+A.orderTotal(o); },0);

    document.getElementById('kpis').innerHTML =
      '<div class="stat"><div class="lab">Orders</div><div class="val">'+list.length+'</div><div class="sub">'+liveList.length+' active, '+(list.length-liveList.length)+' cancelled</div></div>'+
      '<div class="stat"><div class="lab">Pieces</div><div class="val">'+TBM.num(pieces)+'</div><div class="sub">in the selected period</div></div>'+
      '<div class="stat"><div class="lab">Merchandise</div><div class="val">'+TBM.usd(spend)+'</div><div class="sub">excludes freight and decoration</div></div>'+
      '<div class="stat"><div class="lab">Average order</div><div class="val">'+TBM.usd(liveList.length ? spend/liveList.length : 0)+'</div><div class="sub">'+TBM.num(liveList.length?Math.round(pieces/liveList.length):0)+' pcs typical</div></div>';

    var pages = Math.max(1, Math.ceil(list.length/PER));
    if (page > pages) page = pages;
    var slice = list.slice((page-1)*PER, page*PER);

    document.getElementById('resultCount').textContent =
      list.length + ' order' + (list.length===1?'':'s') +
      (list.length>PER ? ' · showing '+((page-1)*PER+1)+'–'+Math.min(page*PER,list.length) : '');

    document.getElementById('ordersTable').innerHTML = list.length
      ? '<thead><tr><th>Order</th><th>Date</th><th>Placed by</th><th>Ship to</th><th class="num">Lines</th><th class="num">Pieces</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>'+
        slice.map(function(o){
          var wh = D.WAREHOUSES.filter(function(x){return x.code===o.warehouse;})[0];
          return '<tr><td class="nw"><a class="mono" style="color:var(--forest);font-weight:600" href="account-order.html?id='+o.id+'">'+o.id+'</a>'+
            '<div class="small muted">'+o.po+'</div></td>'+
            '<td class="nw">'+A.fmtDate(o.date)+'</td>'+
            '<td class="nw">'+o.user+'</td>'+
            '<td class="nw">'+o.shipTo+'<div class="small muted">ex '+(wh?wh.name:o.warehouse)+'</div></td>'+
            '<td class="num">'+o.lines.length+'</td>'+
            '<td class="num">'+TBM.num(A.orderPieces(o))+'</td>'+
            '<td class="num"><b>'+TBM.usd(A.orderTotal(o))+'</b></td>'+
            '<td class="nw">'+A.statusPill(o.status)+'</td>'+
            '<td class="num"><a class="btn btn-outline btn-sm" href="account-order.html?id='+o.id+'">View</a></td></tr>';
        }).join('')+'</tbody>'
      : '';

    document.getElementById('emptyMount').innerHTML = list.length ? '' :
      '<div class="empty" style="margin-top:22px"><div class="ico">'+I.search+'</div>'+
      '<h3 class="h3" style="margin-bottom:8px">No orders match those filters</h3>'+
      '<p class="muted small" style="margin:0 auto 18px">Widen the period or clear a filter.</p>'+
      '<button class="btn btn-outline" id="clr">Clear filters</button></div>';
    var c = document.getElementById('clr');
    if (c) c.addEventListener('click', function(){
      ['fq','fStatus','fUser','fWh'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('fRange').value='12'; page=1; paint();
    });

    var pg = '';
    if (pages>1){
      for (var i=1;i<=pages;i++){
        if (i===1||i===pages||Math.abs(i-page)<=1) pg += page===i ? '<span class="is-current">'+i+'</span>' : '<a href="#" data-p="'+i+'">'+i+'</a>';
        else if (Math.abs(i-page)===2) pg += '<span class="dots">…</span>';
      }
    }
    document.getElementById('pager').innerHTML = pg;
  }

  ['fStatus','fUser','fWh','fRange'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){ page=1; paint(); });
  });
  var t;
  document.getElementById('fq').addEventListener('input', function(){
    clearTimeout(t); t = setTimeout(function(){ page=1; paint(); }, 200);
  });
  document.getElementById('pager').addEventListener('click', function(e){
    var a = e.target.closest('a[data-p]'); if(!a) return;
    e.preventDefault(); page = parseInt(a.dataset.p,10); paint();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var rows = [['Order','Date','PO','Placed by','Ship to','Warehouse','Item','Description','Colour','Size','Decoration','Qty','Unit','Extended','Status']];
    filtered().forEach(function(o){
      o.lines.forEach(function(l){
        rows.push([o.id, A.fmtDate(o.date), o.po, o.user, o.shipTo, o.warehouse,
          l.sku, l.name, TBMBags.color(l.color).name, l.size, l.imprint,
          l.qty, A.unitFor(l).toFixed(2), (A.unitFor(l)*l.qty).toFixed(2), o.status]);
      });
    });
    A.download('tbm-order-history.csv', A.csv(rows));
    TBM.toast('Order history exported');
  });

  paint();
})();
</script>
</body>
</html>
